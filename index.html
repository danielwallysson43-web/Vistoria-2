<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vistoria Técnica - Daniel Tec (Grandstream & Mikrotik)</title>
    <style>
        /* TEMA DANIEL TEC - TECH VIBE */
        :root {
            --cor-acento-tech: #0056b3;
            --cor-brilho-tech: rgba(0, 123, 255, 0.5);
            --preto-fundo: #000000;
            --preto-texto: #1A1A1A;
            --branco: #FFFFFF;
            --cinza-borda: #E2E8F0;
            --cinza-fundo-card: #F8FAFC;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--preto-fundo);
            padding: 20px 10px;
            margin: 0;
            color: var(--preto-texto);
        }

        .container {
            max-width: 700px;
            background-color: var(--branco);
            margin: 0 auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 86, 179, 0.15);
            border-top: 8px solid var(--cor-acento-tech);
        }
        
        .header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--cinza-borda);
        }

        h1 {
            color: var(--cor-acento-tech);
            font-size: 22px;
            text-transform: uppercase;
            font-weight: 900;
            margin-top: 15px;
        }

        .card {
            background: var(--cinza-fundo-card);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--cinza-borda);
            border-left: 5px solid var(--cor-acento-tech);
        }

        .card-title {
            color: var(--cor-acento-tech);
            font-size: 16px;
            margin-top: 0;
            margin-bottom: 15px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .form-group { margin-bottom: 15px; }
        .form-row { display: flex; gap: 10px; }
        .form-row .form-group { flex: 1; }
        
        label {
            display: block;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #CBD5E1;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            background: var(--branco);
            padding: 10px;
            border: 1px solid #CBD5E1;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .checkbox-group input { width: 18px; height: 18px; margin-right: 12px; }

        button {
            width: 100%;
            padding: 18px;
            background-color: var(--cor-acento-tech);
            color: var(--branco);
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        button.btn-secundario {
            background-color: #444;
            padding: 10px;
            width: auto;
            font-size: 13px;
            margin: 0;
        }

        #resultado { display: none; }
        
        .secao-res { margin-bottom: 20px; padding: 15px; background: var(--branco); border-radius: 6px; border: 1px solid #eee; }
        .secao-res h3 { color: var(--cor-acento-tech); font-size: 16px; border-bottom: 2px solid var(--cor-acento-tech); padding-bottom: 5px; }

        @media print {
            body { background-color: white; }
            .container { box-shadow: none; border: none; max-width: 100%; }
            #formulario_perguntas, button { display: none !important; }
            #resultado { display: block !important; border: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Vistoria Técnica - Daniel Tec</h1>
    </div>

    <div id="formulario_perguntas">
        
        <div class="card">
            <h3 class="card-title">0. Dados do Projeto</h3>
            <div class="form-row">
                <div class="form-group"><label>Técnico:</label><input type="text" id="nome_tecnico" value="Daniel Lavor"></div>
                <div class="form-group"><label>Cidade/UF:</label><input type="text" id="cidade" placeholder="Ex: Teresina - PI"></div>
            </div>
            <div class="form-group"><label>Nome do Cliente/Evento:</label><input type="text" id="nome_evento"></div>
        </div>

        <div class="card">
            <h3 class="card-title">1. Perfil e Público</h3>
            <div class="form-group">
                <label>Tipo de Evento:</label>
                <select id="tipo_evento">
                    <option value="Congresso">Palestra / Workshop</option>
                    <option value="Gamer">Gamer / E-Sports</option>
                    <option value="Massa">Show / Grande Público</option>
                    <option value="Transmissao">Transmissão Crítica (Live)</option>
                </select>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Público Wi-Fi:</label><input type="number" id="publico" value="0"></div>
                <div class="form-group"><label>Maquininhas (POS):</label><input type="number" id="maquininhas" value="0"></div>
            </div>
        </div>

        <div class="card">
            <h3 class="card-title">2. Dispositivos Cabeados</h3>
            <div id="lista_cabeados">
                <div class="form-row cabeado-item">
                    <div class="form-group" style="flex: 2;">
                        <label>Descrição:</label>
                        <input type="text" class="desc_cabeado" placeholder="Ex: PC Gamer, Impressora">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Quantidade:</label>
                        <input type="number" class="qtd_cabeado" value="0" min="0">
                    </div>
                </div>
            </div>
            <button type="button" class="btn-secundario" onclick="adicionarCabeado()">+ Adicionar Item</button>
        </div>

        <div class="card">
            <h3 class="card-title">3. Infraestrutura</h3>
            <div class="form-group">
                <label>Ambiente:</label>
                <select id="ambiente">
                    <option value="interno">Interno (Indoor)</option>
                    <option value="externo">Externo (Outdoor)</option>
                    <option value="ambos">Misto (Indoor/Outdoor)</option>
                </select>
            </div>
            <div class="checkbox-group"><input type="checkbox" id="longa_distancia"><label>Distância superior a 100m (Exige Fibra)</label></div>
            <div class="checkbox-group"><input type="checkbox" id="energia_instavel"><label>Energia instável / Uso de Gerador</label></div>
        </div>

        <button onclick="gerarLaudo()">Gerar Laudo Grandstream</button>
    </div>

    <div id="resultado" class="card"></div>
</div>

<script>
    function adicionarCabeado() {
        const container = document.getElementById('lista_cabeados');
        const div = document.createElement('div');
        div.className = 'form-row cabeado-item';
        div.innerHTML = `
            <div class="form-group" style="flex: 2;"><input type="text" class="desc_cabeado" placeholder="Descrição"></div>
            <div class="form-group" style="flex: 1;"><div style="display:flex; gap:5px;"><input type="number" class="qtd_cabeado" value="1" min="1">
            <button type="button" style="background:#dc3545; padding:5px 10px; width:auto;" onclick="this.parentElement.parentElement.parentElement.remove()">X</button></div></div>
        `;
        container.appendChild(div);
    }

    function gerarLaudo() {
        // Coleta de dados
        const tec = document.getElementById('nome_tecnico').value;
        const evt = document.getElementById('nome_evento').value;
        const tipo = document.getElementById('tipo_evento').value;
        const pub = parseInt(document.getElementById('publico').value) || 0;
        const maq = parseInt(document.getElementById('maquininhas').value) || 0;
        const ambiente = document.getElementById('ambiente').value;
        
        let total_cabeados = 0;
        let nomes_cabeados = [];
        document.querySelectorAll('.cabeado-item').forEach(item => {
            let q = parseInt(item.querySelector('.qtd_cabeado').value) || 0;
            let n = item.querySelector('.desc_cabeado').value || "Dispositivo";
            if (q > 0) {
                total_cabeados += q;
                nomes_cabeados.push(`${q}x ${n}`);
            }
        });

        let equipamentos = [];
        let alertas = [];

        // 1. ROTEAMENTO (Mikrotik)
        if (pub + total_cabeados > 250 || tipo === "Massa") {
            equipamentos.push("01x Mikrotik RB4011 ou CCR2004 (Core Router)");
            alertas.push("Rede de alta densidade: Configurar sub-rede /23 ou /22 para evitar falta de IPs.");
        } else {
            equipamentos.push("01x Mikrotik RB760iGS (hEX S)");
        }

        // 2. WIRELESS (Grandstream Equivalentes)
        let capacidade_ap = (tipo === "Gamer") ? 50 : 80;
        let qtd_ap = Math.max(1, Math.ceil(pub / capacidade_ap));

        if (ambiente === 'externo') {
            equipamentos.push(`${qtd_ap}x Grandstream GWN7660LR (Outdoor Wi-Fi 6)`);
        } else if (tipo === "Gamer" || pub > 150) {
            equipamentos.push(`${qtd_ap}x Grandstream GWN7664 (High-Performance 4x4:4 MU-MIMO)`);
        } else {
            equipamentos.push(`${qtd_ap}x Grandstream GWN7660 (Indoor Wi-Fi 6)`);
        }

        // 3. SWITCHING (Grandstream)
        // Cálculo: Dispositivos + APs + Roteador + Uplink
        let portas_totais = total_cabeados + qtd_ap + 2; 
        
        if (portas_totais <= 4) equipamentos.push("01x Switch Grandstream GWN7700 (5 Portas Gigabit)");
        else if (portas_totais <= 7) equipamentos.push("01x Switch Grandstream GWN7701 (8 Portas Gigabit)");
        else if (portas_totais <= 15) equipamentos.push("01x Switch Grandstream GWN7702 (16 Portas Gigabit)");
        else if (portas_totais <= 23) equipamentos.push("01x Switch Grandstream GWN7703 (24 Portas Gigabit)");
        else equipamentos.push("01x Switch Grandstream GWN7704 (48 Portas Gigabit)");

        // 4. INFRA ADICIONAL
        if (document.getElementById('longa_distancia').checked) {
            equipamentos.push("01x Par de Conversores de Mídia Gigabit + Bobina de Fibra Drop");
        }
        if (document.getElementById('energia_instavel').checked || pub > 100) {
            equipamentos.push("01x Nobreak Senoidal 1.5KVA (Mínimo)");
        }

        // Renderização do Resultado
        const resDiv = document.getElementById('resultado');
        resDiv.innerHTML = `
            <h2 style="color:var(--cor-acento-tech); text-align:center;">LAUDO DE VISTORIA TÉCNICA</h2>
            <div class="secao-res">
                <p><b>Evento:</b> ${evt} | <b>Técnico:</b> ${tec}</p>
                <p><b>Cenário:</b> ${tipo} | <b>Dispositivos Wi-Fi:</b> ${pub}</p>
                ${total_cabeados > 0 ? `<p><b>Demanda Cabeada:</b> ${total_cabeados} portas (${nomes_cabeados.join(', ')})</p>` : ''}
            </div>

            <div class="secao-res">
                <h3>📦 Lista de Equipamentos (Solução Grandstream)</h3>
                <ul>${equipamentos.map(e => `<li>${e}</li>`).join('')}</ul>
            </div>

            ${alertas.length ? `<div class="secao-res"><h3>⚠️ Notas de Engenharia</h3><ul>${alertas.map(a => `<li style="color:#d9534f; font-weight:bold;">${a}</li>`).join('')}</ul></div>` : ''}

            <button onclick="window.print()" style="background:#000;">Salvar em PDF / Imprimir</button>
            <button onclick="location.reload()" style="background:#666; margin-top:5px;">Novo Laudo</button>
        `;
        
        document.getElementById('formulario_perguntas').style.display = 'none';
        resDiv.style.display = 'block';
    }
</script>

</body>
</html>

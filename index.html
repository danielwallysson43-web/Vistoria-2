<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vistoria Técnica v3.5 - Daniel Tec</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0056b3">
    <style>
        /* DESIGN SYSTEM - DANIEL TEC (BLACK & ELECTRIC BLUE) */
        :root {
            --primary: #0056b3;
            --primary-glow: rgba(0, 86, 179, 0.4);
            --secondary: #1e293b;
            --bg-dark: #000000;
            --bg-card: #ffffff;
            --text-main: #1a1a1a;
            --border: #e2e8f0;
            --accent-tech: #007bff;
        }

        * { box-sizing: border-box; transition: all 0.2s ease; }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 40px 15px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 86, 179, 0.2);
            border-top: 10px solid var(--primary);
        }

        /* HEADER */
        .main-header {
            text-align: center;
            padding: 30px;
            border-bottom: 2px solid var(--border);
        }

        .logo-placeholder {
            font-size: 24px;
            font-weight: 900;
            color: #000;
            letter-spacing: -1px;
        }

        .logo-placeholder span { color: var(--primary); }

        h1 {
            color: var(--primary);
            font-size: 22px;
            text-transform: uppercase;
            font-weight: 900;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        /* CARDS E FORMULÁRIO */
        .content-padding { padding: 30px; }

        .card {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-left: 6px solid var(--primary);
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .card-title {
            color: var(--primary);
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }

        label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            background: #fff;
        }

        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); }

        .checkbox-group {
            display: flex;
            align-items: center;
            background: #fff;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .checkbox-group input { width: 18px; height: 18px; margin-right: 12px; accent-color: var(--primary); }

        /* BOTÕES */
        .btn-main {
            width: 100%;
            padding: 18px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 10px 20px var(--primary-glow);
        }

        .btn-main:hover { background: var(--accent-tech); transform: translateY(-2px); }

        .btn-gps {
            background: #444;
            color: white;
            padding: 0 15px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        /* RESULTADO */
        #resultado { display: none; padding: 40px; }

        .secao-res {
            background: #fff;
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 6px solid var(--primary);
        }

        .secao-res h3 {
            color: var(--primary);
            font-size: 16px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 5px;
            margin-top: 0;
            text-transform: uppercase;
        }

        .critico {
            background: var(--primary);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 900;
            margin: 20px 0;
            text-transform: uppercase;
            animation: pulse 2s infinite;
        }

        .img-anexo {
            max-width: 100%;
            border-radius: 12px;
            border: 3px solid var(--primary);
            margin: 20px 0;
            display: block;
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.8; } 100% { opacity: 1; } }

        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; border: none; max-width: 100%; }
            #formulario_corpo, .btn-main { display: none !important; }
            #resultado { display: block !important; padding: 0; }
            .btn-imprimir { display: none !important; }
        }

        @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <header class="main-header">
        <div class="logo-placeholder">DANIEL <span>TEC</span></div>
        <h1>Laudo Técnico de Vistoria</h1>
    </header>

    <div id="formulario_corpo" class="content-padding">
        
        <div class="card">
            <h3 class="card-title"><span>0.</span> Dados Gerais</h3>
            <div class="form-row">
                <div class="form-group"><label>Nome do Técnico:</label><input type="text" id="tec_nome" value="Daniel Lavor"></div>
                <div class="form-group"><label>Cidade / UF:</label><input type="text" id="cidade" value="Teresina - PI"></div>
            </div>
            <div class="form-group"><label>Cliente / Evento:</label><input type="text" id="cli_nome" placeholder="Ex: Shopping da Praça"></div>
            
            <div class="form-group">
                <label>📍 Localização Exata (GPS):</label>
                <div style="display: flex; gap: 10px;">
                    <input type="url" id="link_maps" placeholder="Link do Maps ou Capturar ->">
                    <button type="button" class="btn-gps" id="btn_gps" onclick="capturarLocalizacao()">Capturar</button>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group"><label>Data da Vistoria:</label><input type="date" id="data_vis"></div>
                <div class="form-group"><label>Data do Evento:</label><input type="date" id="data_evt"></div>
            </div>
            <div class="form-group">
                <label>📷 Planta ou Foto do Local:</label>
                <input type="file" id="img_local" accept="image/*">
            </div>
        </div>

        <div class="card">
            <h3 class="card-title"><span>1.</span> Perfil e Criticidade</h3>
            <div class="form-group">
                <label>Tipo de Evento:</label>
                <select id="tipo_evt" onchange="verificarGamer()">
                    <option value="Palestra/Congresso">Palestra / Congresso</option>
                    <option value="Feira de Negócios">Feira / Stands</option>
                    <option value="Gamer/E-sports">Gamer / E-sports</option>
                    <option value="Grande Porte/Massa">Grande Porte / Massa</option>
                    <option value="Transmissão Crítica">Live / Transmissão</option>
                </select>
            </div>

            <div id="div_gamer" style="display:none; border-top: 1px dashed #ccc; padding-top: 15px; margin-top: 10px;">
                <div class="form-group">
                    <label>Plataforma Gamer:</label>
                    <select id="plat_gamer" onchange="verificarQtdPcs()">
                        <option value="mobiles">Wi-Fi (Celulares)</option>
                        <option value="pcs">Cabo (PCs/Consoles)</option>
                        <option value="ambos">Ambos (Misto)</option>
                    </select>
                </div>
                <div id="div_pcs" style="display:none">
                    <label>Qtd. de Estações no Cabo:</label>
                    <input type="number" id="qtd_pcs" value="0">
                </div>
            </div>
        </div>

        <div class="card">
            <h3 class="card-title"><span>2.</span> Estimativa de Carga</h3>
            <div class="form-row">
                <div class="form-group"><label>Público:</label><input type="number" id="pub" value="0"></div>
                <div class="form-group"><label>Staff:</label><input type="number" id="stf" value="0"></div>
            </div>
            <div class="form-group"><label>Maquininhas (POS):</label><input type="number" id="maq" value="0"></div>
        </div>

        <div class="card">
            <h3 class="card-title"><span>3.</span> Ambiente e Fatores</h3>
            <div class="form-row">
                <div class="form-group">
                    <label>Ambiente:</label>
                    <select id="amb">
                        <option value="interno">Indoor</option>
                        <option value="externo">Outdoor</option>
                        <option value="misto">Misto</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Divisórias:</label>
                    <select id="div">
                        <option value="amplo">Vão Livre</option>
                        <option value="salas">Muitas Salas</option>
                    </select>
                </div>
            </div>
            <div class="checkbox-group"><input type="checkbox" id="chk_metal"><label>Obstrução Metálica (Tendas/Palco)</label></div>
            <div class="checkbox-group"><input type="checkbox" id="chk_distancia"><label>Distância > 100m (Exige Fibra)</label></div>
            <div class="checkbox-group"><input type="checkbox" id="chk_energia"><label>Energia Instável / Gerador</label></div>
            <div class="checkbox-group"><input type="checkbox" id="chk_hotspot"><label>Exige Hotspot (Leads)</label></div>
        </div>

        <button class="btn-main" onclick="gerarLaudo()">Gerar Laudo de Engenharia</button>
    </div>

    <div id="resultado">
        <div id="laudo_header"></div>
        <div id="img_preview_div"></div>
        <div id="hardware_list"></div>
        <div id="alertas_div"></div>
        <div id="dicas_div"></div>

        <div style="margin-top: 30px; display: flex; gap: 10px;">
            <button class="btn-main btn-imprimir" onclick="window.print()" style="background:#000">🖨️ IMPRIMIR / PDF</button>
            <button class="btn-main btn-imprimir" onclick="location.reload()" style="background:#64748b">NOVA VISTORIA</button>
        </div>
    </div>
</div>

<script>
    // 1. UTILITÁRIOS (DATA E IMAGEM)
    function fmtData(d) { return d ? d.split('-').reverse().join('/') : '--/--/----'; }
    
    function readImg(file) {
        return new Promise((res) => {
            const reader = new FileReader();
            reader.onload = () => res(reader.result);
            reader.readAsDataURL(file);
        });
    }

    // 2. GPS (Lógica Original)
    function capturarLocalizacao() {
        const btn = document.getElementById('btn_gps');
        if (!navigator.geolocation) return alert("GPS não suportado.");
        btn.innerText = "⏳...";
        navigator.geolocation.getCurrentPosition(p => {
            document.getElementById('link_maps').value = `https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`;
            btn.innerText = "✅ OK";
        }, () => { alert("Erro no GPS"); btn.innerText = "Capturar"; }, { enableHighAccuracy: true });
    }

    // 3. UI DINÂMICA
    function verificarGamer() {
        document.getElementById('div_gamer').style.display = (document.getElementById('tipo_evt').value === 'Gamer/E-sports') ? 'block' : 'none';
        verificarQtdPcs();
    }
    function verificarQtdPcs() {
        const p = document.getElementById('plat_gamer').value;
        document.getElementById('div_pcs').style.display = (p === 'pcs' || p === 'ambos') ? 'block' : 'none';
    }

    // 4. LÓGICA DE ENGENHARIA (O CORAÇÃO DO SEU CÓDIGO)
    async function gerarLaudo() {
        const total = (parseInt(document.getElementById('pub').value)||0) + (parseInt(document.getElementById('stf').value)||0) + (parseInt(document.getElementById('maq').value)||0);
        const tipo = document.getElementById('tipo_evt').value;
        const hotspot = document.getElementById('chk_hotspot').checked;
        const gamer = (tipo === 'Gamer/E-sports');
        const amb = document.getElementById('amb').value;
        const metal = document.getElementById('chk_metal').checked;

        let eq = []; let alertas = []; let dicas = [];

        // LÓGICA MIKROTIK
        if (total > 30 || hotspot || gamer || tipo === "Transmissão Crítica") {
            if (total <= 50) eq.push("01x Mikrotik RB 750Gr3 (hEX)");
            else if (total < 150) eq.push("01x Mikrotik RB 760iGS (hEX S)");
            else if (total < 350) eq.push("01x Mikrotik RB 4011 ou RB 5009");
            else eq.push("01x Mikrotik CCR Series (Alta Performance)");
            eq.push("01x ONU em modo BRIDGE (Obrigatório)");
        } else {
            eq.push("01x ONU Wi-Fi AX (Roteando) ou Roteador Giga");
        }

        // LÓGICA ACCESS POINTS
        let cap = (amb === 'externo') ? 100 : 80;
        if (metal) cap *= 0.8;
        let qtd_ap = Math.max(1, Math.ceil(total / cap));
        
        if (tipo === "Grande Porte/Massa" && qtd_ap < 3) qtd_ap = 3;

        if (qtd_ap > 0) {
            let mod = (amb === 'externo') ? 'EAP 610 Outdoor' : 'EAP 620/650 Indoor';
            eq.push(`${qtd_ap}x Access Points ${mod}`);
            
            // Lógica Switch PoE
            if (qtd_ap === 1) eq.push("01x Fonte PoE Gigabit");
            else if (qtd_ap <= 4) eq.push("01x Switch PoE 5 Portas");
            else if (qtd_ap <= 7) eq.push("01x Switch PoE 8 Portas");
            else eq.push("01x Switch PoE 16 Portas");
        }

        // LÓGICA SWITCH GAMER / CABEADO (60+ portas inclusa)
        let qtd_cabo = gamer ? (parseInt(document.getElementById('qtd_pcs').value)||0) : 0;
        if (qtd_cabo > 0) {
            if (qtd_cabo <= 7) eq.push("01x Switch Gigabit 8 Portas");
            else if (qtd_cabo <= 15) eq.push("01x Switch Gigabit 16 Portas");
            else if (qtd_cabo <= 40) eq.push("01x Switch Gigabit 48 Portas");
            else {
                let s48 = Math.floor(qtd_cabo / 48);
                eq.push(`${s48}x Switch Gigabit 48 Portas`);
                eq.push(`01x Switch Gigabit Expansão (Cascateamento)`);
            }
        }

        // INFRA EXTRA
        if (document.getElementById('chk_distancia').checked) {
            eq.push("01x Par de Conversores de Mídia Giga + Fibra");
            alertas.push("LIMITE DE COBRE: Distância superior a 100m. Uso obrigatório de fibra óptica.");
        }
        if (document.getElementById('chk_energia').checked || total > 100) {
            eq.push("01x Nobreak Senoidal Profissional");
        }
        if (tipo === "Transmissão Crítica" || (total > 500)) {
            eq.push("01x Antena Starlink (Backup/Failover)");
            alertas.push("ALTA CRITICIDADE: Configurar Starlink como Link Secundário (Porta WAN2).");
        }

        // ALERTAS TÉCNICOS
        if (total > 250) alertas.push("DHCP OVERFLOW: Rede /24 insuficiente. Configure a sub-rede para /23 ou /22.");
        if (hotspot) dicas.push("VLAN SEPARADA: Crie um SSID exclusivo sem Hotspot para as maquininhas (POS).");
        if (tipo === "Transmissão Crítica") alertas.push("PROIBIDO WI-FI: Equipamentos de Live devem estar 100% no CABO.");

        // RENDERIZAÇÃO
        const cli = document.getElementById('cli_nome').value || "PROJETO TÉCNICO";
        const loc = document.getElementById('link_maps').value;
        
        document.getElementById('laudo_header').innerHTML = `
            <div class="secao-res">
                <h2 style="margin:0; color:var(--primary)">${cli.toUpperCase()}</h2>
                <p><b>Responsável:</b> ${document.getElementById('tec_nome').value} | <b>Cidade:</b> ${document.getElementById('cidade').value}</p>
                <p><b>Data:</b> ${fmtData(document.getElementById('data_vis').value)} | <b>Local:</b> <a href="${loc}" target="_blank">Google Maps</a></p>
                <p><b>Carga:</b> ${total} dispositivos | <b>Tipo:</b> ${tipo}</p>
            </div>
            ${(total > 400 ? '<div class="critico">PROJETO DE ALTA DENSIDADE - REQUER SITE SURVEY</div>' : '')}
        `;

        const file = document.getElementById('img_local').files[0];
        if (file) {
            const b64 = await readImg(file);
            document.getElementById('img_preview_div').innerHTML = `<img src="${b64}" class="img-anexo">`;
        }

        document.getElementById('hardware_list').innerHTML = `<div class="secao-res"><h3>📦 Hardware Exigido</h3><ul>${eq.map(i => `<li>${i}</li>`).join('')}</ul></div>`;
        document.getElementById('alertas_div').innerHTML = alertas.length ? `<div class="secao-res"><h3>🚨 Alertas de Engenharia</h3><ul>${alertas.map(i => `<li style="color:#dc3545; font-weight:bold">⚠️ ${i}</li>`).join('')}</ul></div>` : '';
        document.getElementById('dicas_div').innerHTML = dicas.length ? `<div class="secao-res"><h3>💡 Recomendações</h3><ul>${dicas.map(i => `<li>✔ ${i}</li>`).join('')}</ul></div>` : '';

        document.getElementById('formulario_corpo').style.display = 'none';
        document.getElementById('resultado').style.display = 'block';
        window.scrollTo(0,0);
    }
</script>

<script>
    // REGISTRO DO SERVICE WORKER (Para funcionar Offline)
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').then(() => console.log('PWA Pronto!'));
    }
</script>

</body>
</html>

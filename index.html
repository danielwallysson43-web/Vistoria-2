<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel Tec - Vistoria Pro v6.0</title>
    <style>
        :root { --primary: #0056b3; --bg: #0d0d0d; --card: #1a1a1a; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; padding: 15px; margin: 0; }
        .card { max-width: 500px; margin: 0 auto; background: var(--card); padding: 25px; border-radius: 15px; border-top: 6px solid var(--primary); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: var(--primary); margin-bottom: 20px; text-transform: uppercase; font-size: 20px; }
        label { display: block; margin-top: 15px; font-size: 12px; font-weight: bold; color: #aaa; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #333; background: #262626; color: #fff; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 16px; }
        .btn:active { transform: scale(0.98); }
        .btn-gps { background: #333; font-size: 12px; padding: 10px; margin-top: 8px; border: 1px dashed var(--primary); }
        #status { text-align: center; margin-top: 15px; font-size: 14px; padding: 10px; border-radius: 5px; }
        .loading { color: #ffcc00; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

<div class="card">
    <h2>DANIEL TEC 📡</h2>
    
    <label>Técnico Responsável:</label>
    <input type="text" id="tecnico" value="Daniel Lavor">

    <label>Cliente / Local:</label>
    <input type="text" id="cliente" placeholder="Ex: Condomínio Petrópolis">

    <label>Data da Vistoria:</label>
    <input type="date" id="data_vistoria">

    <label>📍 Localização GPS:</label>
    <input type="text" id="link_maps" placeholder="Clique no botão abaixo para capturar">
    <button class="btn btn-gps" onclick="pegarGPS()">📍 CAPTURAR COORDENADAS</button>

    <label>📦 Equipamentos Sugeridos (Mikrotik/UniFi):</label>
    <textarea id="equipamentos" rows="3" placeholder="Ex: 01x RB760iGS, 05x U6+"></textarea>

    <label>📝 Observações Gerais:</label>
    <textarea id="obs" rows="2" placeholder="Ex: Necessário 50m de fibra extra..."></textarea>

    <label>📷 Anexar Arquivos (Fotos e Vídeos):</label>
    <input type="file" id="midia" accept="image/*,video/*" multiple>
    <small style="color: #666; font-size: 10px;">Você pode selecionar vários arquivos de uma vez.</small>

    <button class="btn" id="btnEnviar" onclick="enviarTudo()">🚀 ENVIAR PARA O GRUPO</button>
    <div id="status"></div>
</div>

<script>
    // --- CONFIGURAÇÃO ---
    const TOKEN = "8797747366:AAHBVt7Xh7O-hms4DmB6c8j5AmWiOhkB6K4";
    const CHAT_ID = "644375739"; // <<< SE FOR GRUPO, COLOQUE O ID COM O SINAL DE MENOS AQUI

    // Definir data de hoje automaticamente
    document.getElementById('data_vistoria').valueAsDate = new Date();

    function pegarGPS() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                const link = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                document.getElementById('link_maps').value = link;
                alert("GPS capturado com sucesso!");
            }, () => alert("Erro ao capturar GPS. Ative a localização."));
        }
    }

    async function enviarTudo() {
        const btn = document.getElementById('btnEnviar');
        const status = document.getElementById('status');
        const arquivos = document.getElementById('midia').files;
        
        const dados = {
            tec: document.getElementById('tecnico').value,
            cli: document.getElementById('cliente').value,
            data: document.getElementById('data_vistoria').value.split('-').reverse().join('/'),
            eq: document.getElementById('equipamentos').value,
            maps: document.getElementById('link_maps').value,
            obs: document.getElementById('obs').value
        };

        if (!dados.cli) return alert("O nome do cliente é obrigatório!");

        btn.disabled = true;
        status.className = "loading";
        status.innerText = "⏳ Processando arquivos e enviando laudo...";

        // 1. Enviar Arquivos (Fotos e Vídeos)
        for (let i = 0; i < arquivos.length; i++) {
            const file = arquivos[i];
            const isVideo = file.type.startsWith('video/');
            const rota = isVideo ? 'sendVideo' : 'sendPhoto';
            const formData = new FormData();
            formData.append("chat_id", CHAT_ID);
            formData.append(isVideo ? "video" : "photo", file);

            status.innerText = `⏳ Enviando arquivo ${i+1} de ${arquivos.length}...`;
            await fetch(`https://api.telegram.org/bot${TOKEN}/${rota}`, { method: "POST", body: formData });
        }

        // 2. Enviar Texto Final
        let msg = `<b>🚀 LAUDO TÉCNICO - DANIEL TEC</b>\n\n`;
        msg += `👤 <b>Técnico:</b> ${dados.tec}\n`;
        msg += `🏢 <b>Cliente:</b> ${dados.cli}\n`;
        msg += `📅 <b>Data:</b> ${dados.data}\n\n`;
        msg += `📦 <b>Equipamentos:</b>\n<i>${dados.eq}</i>\n\n`;
        if (dados.obs) msg += `📝 <b>Obs:</b> ${dados.obs}\n\n`;
        if (dados.maps) msg += `📍 <b>Mapa:</b> <a href="${dados.maps}">Ver Localização</a>\n`;
        msg += `\n✅ <i>Enviado via Vistoria Pro Bot</i>`;

        const response = await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ chat_id: CHAT_ID, text: msg, parse_mode: "HTML" })
        });

        if (response.ok) {
            status.className = "";
            status.innerHTML = "<b style='color:#00ff00'>✅ RELATÓRIO COMPLETO ENVIADO!</b>";
            btn.disabled = false;
            // Limpa campos para a próxima
            document.getElementById('cliente').value = "";
            document.getElementById('midia').value = "";
        } else {
            status.innerText = "❌ Erro ao enviar texto final.";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>

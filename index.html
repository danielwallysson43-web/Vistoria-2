<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel Tec - Vistoria v5.0</title>
    <style>
        :root { --primary: #0056b3; --bg: #000; }
        body { font-family: sans-serif; background: var(--bg); color: white; padding: 15px; }
        .card { background: #1a1a1a; padding: 20px; border-radius: 12px; border-top: 5px solid var(--primary); }
        h2 { color: var(--primary); text-align: center; margin-top: 0; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; font-size: 13px; }
        input, select, textarea { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #333; background: #222; color: white; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn-gps { background: #444; margin-top: 5px; font-size: 12px; padding: 8px; }
        #status { text-align: center; margin-top: 15px; font-size: 14px; }
        input[type="file"] { padding: 5px; background: transparent; }
    </style>
</head>
<body>

<div class="card">
    <h2>DANIEL TEC 📡</h2>
    
    <label>Cliente / Evento:</label>
    <input type="text" id="cliente" placeholder="Ex: Shopping da Praça">

    <label>Localização (GPS):</label>
    <input type="text" id="link_maps" placeholder="Aguardando GPS...">
    <button class="btn btn-gps" onclick="pegarGPS()">📍 CAPTURAR LOCALIZAÇÃO</button>

    <label>Equipamentos (Mikrotik/Unifi):</label>
    <textarea id="equipamentos" rows="3" placeholder="Ex: 01x RB760iGS, 04x U6-Lite"></textarea>

    <label>📷 Foto do Local/Rack:</label>
    <input type="file" id="foto" accept="image/*">

    <button class="btn" onclick="gerarEVoar()">🚀 ENVIAR PARA O GRUPO</button>
    <div id="status"></div>
</div>

<script>
    // --- CONFIGURAÇÃO ---
    const TOKEN = "8797747366:AAHBVt7Xh7O-hms4DmB6c8j5AmWiOhkB6K4";
    const CHAT_ID = "644375739"; // <<< SE FOR GRUPO, COLOQUE O ID COM O SINAL DE MENOS AQUI

    function pegarGPS() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                const link = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                document.getElementById('link_maps').value = link;
                alert("📍 Localização capturada!");
            });
        }
    }

    async function gerarEVoar() {
        const status = document.getElementById('status');
        const cliente = document.getElementById('cliente').value;
        const eq = document.getElementById('equipamentos').value;
        const maps = document.getElementById('link_maps').value;
        const fotoFile = document.getElementById('foto').files[0];

        if (!cliente) return alert("Nome do cliente é obrigatório!");

        status.innerText = "⏳ Enviando laudo e imagem...";
        
        // 1. Enviar Foto (se houver)
        if (fotoFile) {
            const formData = new FormData();
            formData.append("chat_id", CHAT_ID);
            formData.append("photo", fotoFile);
            await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, { method: "POST", body: formData });
        }

        // 2. Enviar Texto Formatado
        let msg = `<b>🚀 NOVO LAUDO: ${cliente}</b>\n\n`;
        msg += `📦 <b>Equipamentos:</b>\n<i>${eq}</i>\n\n`;
        if(maps) msg += `📍 <b>Localização:</b> <a href="${maps}">Ver no Google Maps</a>\n`;
        msg += `\n✅ <i>Gerado por Daniel Tec</i>`;

        const response = await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ chat_id: CHAT_ID, text: msg, parse_mode: "HTML" })
        });

        if (response.ok) {
            status.innerHTML = "<b style='color:green'>✅ ENVIADO COM SUCESSO!</b>";
            setTimeout(() => location.reload(), 3000);
        } else {
            status.innerHTML = "<b style='color:red'>❌ ERRO AO ENVIAR</b>";
        }
    }
</script>

</body>
</html>

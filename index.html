<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vistoria Técnica - Daniel Tec</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0056b3">
    <style>
        /* TEMA DANIEL TEC - VERSÃO TECH: LATERAIS PRETAS, MIOLO BRANCO, DETALHES AZUL ELÉTRICO */
        :root {
            --cor-acento-tech: #0056b3;
            --cor-brilho-tech: rgba(0, 123, 255, 0.5);
            --preto-fundo: #000000;
            --preto-texto: #1A1A1A;
            --branco: #FFFFFF;
            --cinza-borda: #E2E8F0;
            --cinza-fundo-card: #F8FAFC;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--preto-fundo);
            padding: 20px 10px;
            margin: 0;
            color: var(--preto-texto);
        }

        .container {
            max-width: 700px;
            background-color: var(--branco);
            margin: 0 auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 86, 179, 0.15);
            border-top: 8px solid var(--cor-acento-tech);
        }
        
        .header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--cinza-borda);
        }

        .logo {
            max-width: 200px;
            height: auto;
        }

        h1 {
            color: var(--cor-acento-tech);
            font-size: 22px;
            text-transform: uppercase;
            font-weight: 900;
            margin-top: 15px;
            letter-spacing: 1.5px;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.1);
        }

        .card {
            background: var(--cinza-fundo-card);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--cinza-borda);
            border-left: 5px solid var(--cor-acento-tech);
        }

        .card-title {
            color: var(--cor-acento-tech);
            font-size: 16px;
            margin-top: 0;
            margin-bottom: 15px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .form-group { margin-bottom: 15px; }
        .form-row { display: flex; gap: 10px; }
        .form-row .form-group { flex: 1; }
        
        label {
            display: block;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 6px;
            color: #333;
        }

        input[type="text"], input[type="date"], input[type="number"], select, input[type="file"], input[type="url"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #CBD5E1;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            font-family: inherit;
            background: var(--branco);
        }

        input:focus, select:focus {
            border-color: var(--cor-brilho-tech);
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.4);
        }

        input[type="file"] { padding: 9px; cursor: pointer; }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            background: var(--branco);
            padding: 12px;
            border: 1px solid #CBD5E1;
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .checkbox-group:hover {
            border-color: var(--cor-brilho-tech);
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.1);
        }

        .checkbox-group input {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            accent-color: var(--cor-acento-tech);
            margin-top: 2px;
        }

        .checkbox-group label {
            margin-bottom: 0;
            font-weight: normal;
            font-size: 13px;
            cursor: pointer;
            line-height: 1.4;
            color: #444;
        }

        button {
            width: 100%;
            padding: 18px;
            background-color: var(--cor-acento-tech);
            color: var(--branco);
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.3s, box-shadow 0.3s, transform 0.2s;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        button:hover {
            background-color: #007bff;
            box-shadow: 0 0 15px rgba(0, 123, 255, 0.6);
            transform: scale(1.02);
        }
        
        button.btn-secundario {
            background-color: #444;
            margin: 0;
            padding: 0 15px;
            width: auto;
            font-size: 14px;
            white-space: nowrap;
        }

        button.btn-secundario:hover {
            background-color: #666;
            box-shadow: 0 0 10px rgba(100, 100, 100, 0.3);
        }
        
        button.btn-imprimir {
            background-color: var(--preto-fundo);
            margin-top: 20px;
            margin-bottom: 0;
            border: 1px solid var(--cor-acento-tech);
        }

        button.btn-imprimir:hover {
            background-color: #333;
            border-color: #007bff;
        }

        #resultado {
            display: none;
            background: #fdfdfd;
            border: 2px solid var(--cor-acento-tech);
            border-left: 10px solid var(--cor-acento-tech);
        }
        
        .secao-res {
            margin-bottom: 20px;
            padding: 15px;
            background: var(--branco);
            border-radius: 6px;
            border: 1px solid #eee;
        }

        .secao-res h3 {
            color: var(--cor-acento-tech);
            font-size: 16px;
            border-bottom: 2px solid var(--cor-acento-tech);
            padding-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        ul { padding-left: 20px; }
        li {
            margin-bottom: 10px;
            font-size: 14px;
            line-height: 1.5;
            color: #333;
        }

        .alerta-item {
            color: #007bff;
            font-weight: bold;
        }

        .dica-item {
            color: #1a1a1a;
            font-weight: bold;
        }

        .critico {
            background: var(--cor-acento-tech);
            color: var(--branco);
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(0, 123, 255, 0.6);
        }

        #div_gamer_opcoes {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed #ccc;
        }
        
        .img-anexo {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
            border: 2px solid var(--cor-acento-tech);
            margin-top: 15px;
            object-fit: contain;
        }

        @media print {
            body { background-color: white; padding: 0; color: black; }
            .container { box-shadow: none; border: none; max-width: 100%; margin: 0; padding: 0; border-top: none; }
            #formulario_perguntas, button { display: none !important; }
            #resultado { border: none; display: block; border-left: none; }
            .secao-res, .critico, .img-anexo { page-break-inside: avoid; border: none; }
            h2, h3 { page-break-after: avoid; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="https://via.placeholder.com/200x80/000000/007BFF?text=DANIEL+TEC" alt="Daniel Tec" class="logo">
        <h1>Laudo Técnico de Vistoria</h1>
    </div>

</div>

</html>

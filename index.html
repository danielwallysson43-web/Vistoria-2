<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vistoria Técnica - Daniel Tec (Grandstream Expert)</title>
    <style>
        /* TEMA DANIEL TEC - DARK TECH UI */
        :root {
            --cor-acento: #0056b3;
            --cor-brilho: rgba(0, 86, 179, 0.4);
            --fundo-dark: #0a0a0a;
            --texto-dark: #1A1A1A;
            --branco: #FFFFFF;
            --cinza-borda: #CBD5E1;
            --cinza-fundo: #F8FAFC;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--fundo-dark);
            padding: 20px 10px;
            margin: 0;
            color: var(--texto-dark);
        }

        .container {
            max-width: 800px;
            background-color: var(--branco);
            margin: 0 auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 86, 179, 0.25);
            border-top: 12px solid var(--cor-acento);
        }
        
        .header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #eee; padding-bottom: 20px; }
        h1 { color: var(--cor-acento); font-size: 26px; text-transform: uppercase; font-weight: 900; letter-spacing: 2px; margin: 10px 0; }
        h2 { font-size: 14px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }

        .card {
            background: var(--cinza-fundo);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--cinza-borda);
            border-left: 6px solid var(--cor-acento);
            transition: 0.3s;
        }

        .card:hover { border-color: var(--cor-acento); }

        .card-title {
            color: var(--cor-acento);
            font-size: 15px;
            margin-bottom: 15px;
            text-transform: uppercase;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group { margin-bottom: 15px; }
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }
        
        label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 6px; color: #334155; }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--cinza-borda);
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            background: var(--branco);
            outline: none;
        }

        input:focus { border-color: var(--cor-acento); box-shadow: 0 0 0 3px var(--cor-brilho); }

        .checkbox-group {
            display: flex;
            align-items: center;
            background: var(--branco);
            padding: 12px;
            border: 1px solid var(--cinza-borda);
            border-radius: 6px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .checkbox-group:hover { background: #f1f5f9; }
        .checkbox-group input { width: 20px; height: 20px; margin-right: 12px; accent-color: var(--cor-acento); }

        button {
            width: 100%;
            padding: 20px;
            background-color: var(--cor-acento);
            color: var(--branco);
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px var(--cor-brilho);
            transition: 0.3s;
        }

        button:hover { background-color: #004494; transform: translateY(-2px); box-shadow: 0 6px 20px var(--cor-brilho); }
        .btn-secundario { background-color: #334155; width: auto; font-size: 12px; padding: 10px 15px; margin: 0; box-shadow: none; }

        #div_gamer_opcoes, #div_qtd_pcs { display: none; margin-top: 10px; padding: 15px; border: 2px dashed var(--cor-acento); border-radius: 8px; background: #fff; }

        #resultado { display: none; animation: fadeIn 0.5s ease-in-out; }
        .secao-res { margin-bottom: 25px; padding: 20px; background: #fff; border-radius: 8px; border: 1px solid #e2e8f0; }
        .secao-res h3 { color: var(--cor-acento); font-size: 17px; border-bottom: 2px solid var(--cor-acento); padding-bottom: 8px; margin-top: 0; text-transform: uppercase; }
        
        .alerta-box { color: #b91c1c; font-weight: bold; list-style: none; padding: 0; }
        .alerta-box li { margin-bottom: 8px; padding-left: 25px; position: relative; }
        .alerta-box li::before { content: "⚠️"; position: absolute; left: 0; }

        .img-anexo { max-width: 100%; border-radius: 8px; border: 3px solid var(--cor-acento); margin-top: 15px; display: block; margin-left: auto; margin-right: auto; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; border: none; max-width: 100%; padding: 0; }
            #formulario_perguntas, button, .btn-secundario { display: none !important; }
            #resultado { display: block !important; border: none; }
            .card { border: 1px solid #eee; page-break-inside: avoid; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Daniel Tec - Networking & Security</h2>
        <h1>Laudo de Vistoria Técnica</h1>
    </div>

    <div id="formulario_perguntas">
        <div class="card">
            <h3 class="card-title">0. Identificação do Projeto</h3>
            <div class="form-row">
                <div class="form-group"><label>Técnico:</label><input type="text" id="nome_tecnico" value="Daniel Lavor"></div>
                <div class="form-group"><label>Cidade / UF:</label><input type="text" id="cidade" placeholder="Ex: Teresina - PI"></div>
            </div>
            <div class="form-group"><label>Cliente / Evento:</label><input type="text" id="nome_evento" placeholder="Ex: Shopping da Praça"></div>
            <div class="form-group">
                <label>📍 Localização GPS:</label>
                <div style="display: flex; gap: 10px;">
                    <input type="url" id="link_maps" placeholder="Link do Google Maps">
                    <button type="button" class="btn-secundario" onclick="obterGPS()">Capturar GPS</button>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Data Vistoria:</label><input type="date" id="data_vistoria"></div>
                <div class="form-group"><label>Data Evento:</label><input type="date" id="data_evento"></div>
            </div>
            <div class="form-group"><label>📷 Planta ou Foto do Local:</label><input type="file" id="imagem_local" accept="image/*"></div>
        </div>

        <div class="card">
            <h3 class="card-title">1. Perfil do Evento</h3>
            <div class="form-group">
                <label>Natureza do Evento:</label>
                <select id="tipo_evento" onchange="toggleGamer()">
                    <option value="Empresarial">Empresarial / Workshop</option>
                    <option value="Feira">Feira / Stands</option>
                    <option value="Gamer">Gamer / E-sports (Baixa Latência)</option>
                    <option value="Massa">Grande Público / Show</option>
                    <option value="Transmissao">Transmissão Crítica (Live Streaming)</option>
                </select>
            </div>
            <div id="div_gamer_opcoes">
                <div class="form-group">
                    <label>Perfil Gamer:</label>
                    <select id="perfil_gamer" onchange="togglePcs()">
                        <option value="mobile">Mobile (Wi-Fi)</option>
                        <option value="estacoes">Estações Fixas (Cabo)</option>
                        <option value="hibrido">Híbrido (Cabo + Wi-Fi)</option>
                    </select>
                </div>
                <div id="div_qtd_pcs">
                    <label>Quantidade de PCs/Consoles:</label>
                    <input type="number" id="qtd_pcs_gamer" value="0">
                </div>
            </div>
        </div>

        <div class="card">
            <h3 class="card-title">2. Estimativa de Dispositivos</h3>
            <div class="form-row">
                <div class="form-group"><label>Público Wi-Fi:</label><input type="number" id="publico" value="0"></div>
                <div class="form-group"><label>Staff / Produção:</label><input type="number" id="staff" value="0"></div>
            </div>
            <div class="form-group"><label>Maquininhas de Cartão (POS):</label><input type="number" id="maquininhas" value="0"></div>
        </div>

        <div class="card">
            <h3 class="card-title">3. Dispositivos Cabeados (Extra)</h3>
            <div id="container_cabeados">
                <div class="form-row item-cabeado">
                    <div class="form-group" style="flex: 2;"><input type="text" class="cabo_desc" placeholder="Ex: Smart TV, DVR, Totem"></div>
                    <div class="form-group" style="flex: 1;"><input type="number" class="cabo_qtd" value="0" placeholder="Qtd"></div>
                </div>
            </div>
            <button type="button" class="btn-secundario" onclick="addLinhaCabo()">+ Adicionar Dispositivo</button>
        </div>

        <div class="card">
            <h3 class="card-title">4. Fatores de Infraestrutura</h3>
            <div class="form-row">
                <div class="form-group">
                    <label>Ambiente:</label>
                    <select id="ambiente">
                        <option value="indoor">Indoor (Interno)</option>
                        <option value="outdoor">Outdoor (Externo)</option>
                        <option value="misto">Misto (Interno/Externo)</option>
                    </select>
                </div>
            </div>
            <div class="checkbox-group"><input type="checkbox" id="metal"><label>Obstruções Metálicas (Tendas/Palcos)</label></div>
            <div class="checkbox-group"><input type="checkbox" id="fibra"><label>Distância > 100m (Necessário Fibra/Conversor)</label></div>
            <div class="checkbox-group"><input type="checkbox" id="energia"><label>Energia Instável (Necessário Nobreak Senoidal)</label></div>
            <div class="checkbox-group"><input type="checkbox" id="lead"><label>Exige Captura de Leads (Hotspot/Portal)</label></div>
        </div>

        <button onclick="processarLaudo()">Gerar Laudo Grandstream</button>
    </div>

    <div id="resultado"></div>
</div>

<script>
    function obterGPS() {
        if (!navigator.geolocation) return alert("GPS não disponível.");
        navigator.geolocation.getCurrentPosition(p => {
            document.getElementById('link_maps').value = `https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`;
        }, () => alert("Erro ao capturar localização."));
    }

    function toggleGamer() {
        document.getElementById('div_gamer_opcoes').style.display = (document.getElementById('tipo_evento').value === 'Gamer') ? 'block' : 'none';
    }

    function togglePcs() {
        let p = document.getElementById('perfil_gamer').value;
        document.getElementById('div_qtd_pcs').style.display = (p === 'estacoes' || p === 'hibrido') ? 'block' : 'none';
    }

    function addLinhaCabo() {
        const div = document.createElement('div');
        div.className = 'form-row item-cabeado';
        div.innerHTML = `<div class="form-group" style="flex: 2;"><input type="text" class="cabo_desc" placeholder="Descrição"></div>
            <div class="form-group" style="flex: 1;"><div style="display:flex; gap:5px;"><input type="number" class="cabo_qtd" value="1">
            <button type="button" style="background:#dc3545; color:white; border:none; padding:0 10px; border-radius:4px;" onclick="this.parentElement.parentElement.parentElement.remove()">X</button></div></div>`;
        document.getElementById('container_cabeados').appendChild(div);
    }

    function formataData(d) { return d ? d.split('-').reverse().join('/') : 'Não informada'; }

    async function processarLaudo() {
        // Coleta de Dados
        const tec = document.getElementById('nome_tecnico').value;
        const cli = document.getElementById('nome_evento').value;
        const cid = document.getElementById('cidade').value;
        const maps = document.getElementById('link_maps').value;
        const tipo = document.getElementById('tipo_evento').value;
        
        let wifi_total = (parseInt(document.getElementById('publico').value) || 0) + 
                         (parseInt(document.getElementById('staff').value) || 0) + 
                         (parseInt(document.getElementById('maquininhas').value) || 0);
        
        let cabeados_total = 0;
        let lista_itens_cabo = [];
        document.querySelectorAll('.item-cabeado').forEach(el => {
            let q = parseInt(el.querySelector('.cabo_qtd').value) || 0;
            let d = el.querySelector('.cabo_desc').value || "Dispositivo";
            if (q > 0) { cabeados_total += q; lista_itens_cabo.push(`${q}x ${d}`); }
        });

        if (tipo === 'Gamer') {
            let pcs = parseInt(document.getElementById('qtd_pcs_gamer').value) || 0;
            if (pcs > 0) { cabeados_total += pcs; lista_itens_cabo.push(`${pcs}x Estações Gamer`); }
        }

        let eq = []; let avisos = [];

        // 1. ROTEAMENTO MIKROTIK
        if (wifi_total + cabeados_total > 250 || tipo === 'Transmissao' || tipo === 'Massa') {
            eq.push("01x Mikrotik RB4011 ou CCR2004 (Core da Rede)");
            avisos.push("ALTA DENSIDADE: Configurar Sub-rede /23 ou /22 para evitar falta de IPs.");
        } else {
            eq.push("01x Mikrotik RB760iGS (hEX S)");
        }

        // 2. WIRELESS GRANDSTREAM
        let cap_ap = (document.getElementById('ambiente').value === 'outdoor') ? 100 : 80;
        if (tipo === 'Gamer') cap_ap = 40;
        let qtd_ap = Math.max(1, Math.ceil(wifi_total / cap_ap));

        if (document.getElementById('ambiente').value === 'outdoor') {
            eq.push(`${qtd_ap}x Grandstream GWN7660LR (Outdoor Wi-Fi 6)`);
        } else if (tipo === 'Gamer' || wifi_total > 150) {
            eq.push(`${qtd_ap}x Grandstream GWN7664 (High-Performance 4x4)`);
        } else {
            eq.push(`${qtd_ap}x Grandstream GWN7660 (Indoor Wi-Fi 6)`);
        }

        // 3. SWITCHING (LÓGICA DE 60+ PORTAS)
        let portas_necessarias = cabeados_total + qtd_ap + 2; // +2 para uplink e margem
        if (portas_necessarias <= 8) eq.push("01x Switch Grandstream GWN7701 (8 Portas)");
        else if (portas_necessarias <= 16) eq.push("01x Switch Grandstream GWN7702 (16 Portas)");
        else if (portas_necessarias <= 24) eq.push("01x Switch Grandstream GWN7703 (24 Portas)");
        else if (portas_necessarias <= 48) eq.push("01x Switch Grandstream GWN7704 (48 Portas)");
        else {
            let n48 = Math.floor(portas_necessarias / 48);
            let resto = portas_necessarias % 48;
            eq.push(`${n48}x Switch Grandstream GWN7704 (48 Portas Gigabit)`);
            if (resto > 0) {
                let modResto = (resto <= 24) ? "GWN7703 (24P)" : "GWN7704 (48P)";
                eq.push(`01x Switch Grandstream ${modResto} para expansão`);
            }
            avisos.push(`EXPANSÃO: Demanda de ${portas_necessarias} portas. Utilizar cascateamento via Uplink Gigabit.`);
        }

        // 4. INFRA EXTRA
        if (document.getElementById('fibra').checked) eq.push("01x Par de Conversores de Mídia Gigabit + Fibra Drop");
        if (document.getElementById('energia').checked) eq.push("01x Nobreak Senoidal Profissional (Mín. 1500VA)");
        if (document.getElementById('metal').checked) avisos.push("METAL: Evitar APs atrás de estruturas metálicas para prevenir reflexão de sinal.");

        // Foto Handle
        let fotoHtml = '';
        const f = document.getElementById('imagem_local').files[0];
        if (f) {
            const r = new FileReader();
            r.onload = e => { document.getElementById('img_out').src = e.target.result; document.getElementById('img_out').style.display = 'block'; };
            r.readAsDataURL(f);
            fotoHtml = `<img id="img_out" class="img-anexo" style="display:none;">`;
        }

        // Render
        const res = document.getElementById('resultado');
        res.innerHTML = `
            <div class="secao-res">
                <h3>📋 Dados do Relatório</h3>
                <p><b>Técnico:</b> ${tec} | <b>Cliente:</b> ${cli}</p>
                <p><b>Local:</b> ${cid} | <a href="${maps}" target="_blank">📍 Ver Localização</a></p>
                <p><b>Datas:</b> Vistoria: ${formataData(document.getElementById('data_vistoria').value)} | Evento: ${formataData(document.getElementById('data_evento').value)}</p>
                <p><b>Carga Wi-Fi:</b> ${wifi_total} usuários | <b>Portas Cabeadas:</b> ${cabeados_total}</p>
                ${lista_itens_cabo.length ? `<p><b>Detalhamento Cabo:</b> ${lista_itens_cabo.join(', ')}</p>` : ''}
            </div>
            ${fotoHtml}
            <div class="secao-res">
                <h3>📦 Hardware Recomendado (Grandstream / Mikrotik)</h3>
                <ul>${eq.map(x => `<li><b>${x}</b></li>`).join('')}</ul>
            </div>
            ${avisos.length ? `<div class="secao-res"><h3>🚨 Alertas de Engenharia</h3><ul class="alerta-box">${avisos.map(a => `<li>${a}</li>`).join('')}</ul></div>` : ''}
            <button onclick="window.print()" style="background:#000;">Exportar PDF Profissional</button>
            <button onclick="location.reload()" style="background:#666; margin-top:10px;">Nova Vistoria</button>
        `;
        res.style.display = 'block';
        document.getElementById('formulario_perguntas').style.display = 'none';
        window.scrollTo(0,0);
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerador de Laudo</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; }
        button { padding: 10px 15px; margin-top: 10px; cursor: pointer; }
        #resultado { margin-top: 30px; padding: 20px; border: 1px solid #ccc; display: none; }
        .img-anexo { max-width: 300px; margin-top: 15px; }
    </style>
</head>
<body>

<h2>Gerador de Laudo</h2>

<label>Técnico</label>
<input id="nome_tecnico">

<label>Nome do Evento</label>
<input id="nome_evento">

<label>Cidade</label>
<input id="cidade">

<label>Data da Vistoria</label>
<input type="date" id="data_vistoria">

<label>Data do Evento</label>
<input type="date" id="data_evento">

<label>Endereço (GPS)</label>
<input id="link_maps">
<button id="btn_gps" onclick="capturarLocalizacao()">Capturar GPS</button>

<label>Imagem do Local</label>
<input type="file" id="imagem_local" accept="image/*">

<label>Tipo do Evento</label>
<select id="tipo_evento" onchange="verificarGamer()">
    <option>Show</option>
    <option>Corporativo</option>
    <option>Gamer/E-sports</option>
    <option>Religioso</option>
    <option>Treinamento</option>
</select>

<div id="div_gamer_opcoes" style="display:none;">
    <label>Plataforma Gamer</label>
    <select id="plataforma_gamer" onchange="verificarQtdPcs()">
        <option value="console">Consoles</option>
        <option value="pcs">PCs</option>
        <option value="ambos">Ambos</option>
    </select>

    <div id="div_qtd_pcs" style="display:none;">
        <label>Quantidade de PCs</label>
        <input id="qtd_pcs" type="number">
    </div>
</div>

<label>Público</label>
<input id="publico" type="number">

<label>Staff</label>
<input id="staff" type="number">

<label>Maquininhas</label>
<input id="maquininhas" type="number">

<label>Ambiente</label>
<select id="ambiente">
    <option value="interno">Interno</option>
    <option value="externo">Externo</option>
</select>

<label>Divisórias</label>
<select id="divisorias">
    <option value="aberto">Aberto</option>
    <option value="salas">Com salas</option>
</select>

<p><input type="checkbox" id="metal"> Estrutura metálica?</p>
<p><input type="checkbox" id="fixacao"> Tem local para fixação?</p>
<p><input type="checkbox" id="distancia_100m"> Distância > 100m</p>
<p><input type="checkbox" id="tem_live"> Vai ter live?</p>
<p><input type="checkbox" id="energia_oscila"> Energia instável?</p>
<p><input type="checkbox" id="tem_hotspot"> Tem hotspot?</p>

<button onclick="gerarProjeto()">Gerar Laudo</button>

<div id="resultado"></div>

<script>
    const $ = id => document.getElementById(id);

    function formatarData(dataISO) {
        if (!dataISO) return "Não informada";
        let partes = dataISO.split('-');
        return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }

    function lerImagemAsBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject("Erro ao ler imagem");
            reader.readAsDataURL(file);
        });
    }

    function capturarLocalizacao() {
        const btn = $('btn_gps');
        const input = $('link_maps');

        if (!navigator.geolocation) {
            alert("GPS não suportado");
            return;
        }

        btn.innerText = "⏳ Buscando...";
        btn.style.backgroundColor = "#ff9800";

        navigator.geolocation.getCurrentPosition(
            (p) => {
                const url = `https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`;
                input.value = url;
                btn.innerText = "✅ Salvo";
                btn.style.backgroundColor = "#28a745";
            },
            () => {
                alert("Erro ao capturar GPS");
                btn.innerText = "Capturar GPS";
                btn.style.backgroundColor = "#444";
            },
            { enableHighAccuracy: true }
        );
    }

    function verificarGamer() {
        $('div_gamer_opcoes').style.display =
            $('tipo_evento').value === 'Gamer/E-sports' ? 'block' : 'none';
        verificarQtdPcs();
    }

    function verificarQtdPcs() {
        const plat = $('plataforma_gamer').value;
        $('div_qtd_pcs').style.display =
            (plat === 'pcs' || plat === 'ambos') ? 'block' : 'none';
    }

    function addAlerta(lista, texto) {
        lista.push(`⚠️ ${texto}`);
    }

    function calcularCapacidade(base, ambiente, metal, divisorias) {
        let cap = base;

        if (ambiente === 'externo') cap = 100;
        if (metal) cap *= 0.8;
        if (divisorias === 'salas') cap *= 0.85;

        return cap;
    }

    async function gerarProjeto() {

        const resDiv = $('resultado');
        resDiv.style.display = 'block';
        resDiv.innerHTML = "<p>🔄 Gerando análise técnica...</p>";

        setTimeout(async () => {

            const tec = $('nome_tecnico').value || 'Não preenchido';
            const evt = $('nome_evento').value || 'Não preenchido';
            const cidade = $('cidade').value || 'Não preenchida';
            const locUrl = $('link_maps').value;

            const htmlLocal = locUrl
                ? `<a href="${locUrl}" target="_blank">📍 Ver no Maps</a>`
                : 'Não informada';

            const dVist = formatarData($('data_vistoria').value);
            const dEvt = formatarData($('data_evento').value);

            let imgHTML = '';
            let alertas = [];
            try {
                const file = $('imagem_local').files[0];
                if (file) {
                    const base64 = await lerImagemAsBase64(file);
                    imgHTML = `<img src="${base64}" class="img-anexo">`;
                }
            } catch {
                addAlerta(alertas, "Erro ao carregar imagem");
            }

            const pub = +$('publico').value || 0;
            const stf = +$('staff').value || 0;
            const maq = +$('maquininhas').value || 0;
            const total = pub + stf + maq;

            const ambiente = $('ambiente').value;
            const divisorias = $('divisorias').value;
            const metal = $('metal').checked;
            const fixacao = $('fixacao').checked;

            const longa = $('distancia_100m').checked;
            const live = $('tem_live').checked;
            const energia = $('energia_oscila').checked;

            let eq = [];

            const cap = calcularCapacidade(80, ambiente, metal, divisorias);

            let aps = Math.ceil(total / cap);

            if (aps > 0) {
                eq.push(`${aps}x Access Points Wi-Fi 6`);

                if (aps > 1) eq.push("Switch PoE");
                else eq.push("Injetor PoE");
            }

            if (total > 50) {
                eq.push("Roteador Mikrotik");
            } else {
                eq.push("Roteador padrão");
            }

            if (longa) {
                eq.push("Fibra óptica");
                addAlerta(alertas, "Distância maior que 100m");
            }

            if (live) {
                addAlerta(alertas, "Live deve ser via cabo");
            }

            if (!fixacao) {
                addAlerta(alertas, "Instalar AP acima de 2.5m");
            }

            if (energia) {
                eq.push("Nobreak");
            }

            if (total > 300) {
                addAlerta(alertas, "Alta densidade - ajustar canais");
            }

            const html = `
                <h2>📋 LAUDO</h2>

                <p><b>Cliente:</b> ${evt}</p>
                <p><b>Técnico:</b> ${tec}</p>
                <p><b>Cidade:</b> ${cidade}</p>
                <p><b>Data:</b> ${dVist}</p>

                ${imgHTML}

                <h3>Equipamentos</h3>
                <ul>${eq.map(i => `<li>${i}</li>`).join('')}</ul>

                <h3>Alertas</h3>
                <ul>${alertas.map(i => `<li>${i}</li>`).join('')}</ul>

                <button onclick="window.print()">Imprimir</button>
            `;

            resDiv.innerHTML = html;

        }, 300);
    }
</script>

</body>
</html>

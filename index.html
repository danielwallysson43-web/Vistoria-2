<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vistoria Técnica - Daniel Tec</title>
    <style>
        :root {
            --cor-acento-tech: #0056b3;
            --cor-brilho-tech: rgba(0, 123, 255, 0.5);
            --preto-fundo: #000000;
            --preto-texto: #1A1A1A;
            --branco: #FFFFFF;
            --cinza-borda: #E2E8F0;
            --cinza-fundo-card: #F8FAFC;
        }

        body { font-family: 'Segoe UI', sans-serif; background-color: var(--preto-fundo); padding: 20px 10px; margin: 0; color: var(--preto-texto); }
        .container { max-width: 700px; background-color: var(--branco); margin: 0 auto; padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 86, 179, 0.15); border-top: 8px solid var(--cor-acento-tech); }
        .header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid var(--cinza-borda); padding-bottom: 20px; }
        h1 { color: var(--cor-acento-tech); font-size: 22px; text-transform: uppercase; font-weight: 900; }
        .card { background: var(--cinza-fundo-card); padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--cinza-borda); border-left: 5px solid var(--cor-acento-tech); }
        .card-title { color: var(--cor-acento-tech); font-size: 16px; margin-bottom: 15px; text-transform: uppercase; font-weight: bold; }
        .form-group { margin-bottom: 15px; }
        .form-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .form-row .form-group { flex: 1; min-width: 200px; }
        label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 6px; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #CBD5E1; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
        input:focus { border-color: var(--cor-acento-tech); outline: none; box-shadow: 0 0 8px var(--cor-brilho-tech); }
        .checkbox-group { display: flex; align-items: flex-start; background: var(--branco); padding: 12px; border: 1px solid #CBD5E1; border-radius: 6px; margin-bottom: 8px; cursor: pointer; }
        .checkbox-group input { margin-right: 12px; width: 18px; height: 18px; accent-color: var(--cor-acento-tech); }
        
        button { width: 100%; padding: 18px; background-color: var(--cor-acento-tech); color: var(--branco); border: none; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin: 10px 0; }
        button:hover { background-color: #007bff; transform: scale(1.01); }
        .btn-secundario { background-color: #444; width: auto; font-size: 14px; padding: 10px 20px; }
        
        #resultado { display: none; margin-top: 30px; border: 2px solid var(--cor-acento-tech); border-left-width: 10px; padding: 20px; background: #fff; }
        .secao-res { margin-bottom: 20px; padding: 15px; border: 1px solid #eee; border-radius: 6px; }
        .alerta-item { color: #d9534f; font-weight: bold; }
        .img-anexo { max-width: 100%; border-radius: 8px; border: 2px solid var(--cor-acento-tech); margin-top: 10px; }
        #status_bot { text-align: center; font-weight: bold; padding: 10px; border-radius: 5px; display: none; }

        @media print {
            #formulario_perguntas, button, .btn-secundario { display: none !important; }
            #resultado { display: block !important; border: none !important; }
            body { background: white; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 id="top">Daniel Tec - Vistoria Inteligente</h1>
    </div>

    <div id="formulario_perguntas">
        <div class="card">
            <h3 class="card-title">0. Dados do Técnico e Local</h3>
            <div class="form-row">
                <div class="form-group"><label>Técnico:</label><input type="text" id="nome_tecnico" value="Daniel Lavor"></div>
                <div class="form-group"><label>Cidade/UF:</label><input type="text" id="cidade" value="Teresina - PI"></div>
            </div>
            <div class="form-group"><label>Nome do Evento/Cliente:</label><input type="text" id="nome_evento" placeholder="Ex: Shopping da Praça"></div>
            <div class="form-group">
                <label>📍 Localização GPS:</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="link_maps" placeholder="Aguardando GPS...">
                    <button type="button" class="btn-secundario" onclick="capturarGPS()">GPS</button>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Data da Vistoria:</label><input type="date" id="data_vistoria"></div>
                <div class="form-group"><label>Data do Evento:</label><input type="date" id="data_evento"></div>
            </div>
        </div>

        <div class="card">
            <h3 class="card-title">1. Carga e Infraestrutura</h3>
            <div class="form-row">
                <div class="form-group"><label>Tipo de Evento:</label>
                    <select id="tipo_evento">
                        <option value="Palestra/Congresso">Palestra/Workshop</option>
                        <option value="Feira de Negócios">Feira/Stands</option>
                        <option value="Gamer/E-sports">Gamer/E-sports</option>
                        <option value="Grande Porte/Massa">Show/Festival</option>
                        <option value="Transmissão Crítica">Live/TV</option>
                    </select>
                </div>
                <div class="form-group"><label>Público + Staff:</label><input type="number" id="total_conexoes" value="50"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Ambiente:</label>
                    <select id="ambiente">
                        <option value="interno">Interno (Indoor)</option>
                        <option value="externo">Externo (Outdoor)</option>
                        <option value="ambos">Misto (Indoor/Outdoor)</option>
                    </select>
                </div>
                <div class="form-group"><label>Obs. Técnicas:</label><textarea id="obs_campo" rows="1" placeholder="Ex: Rack no forro..."></textarea></div>
            </div>
        </div>

        <div class="card">
            <h3 class="card-title">2. Fatores de Risco</h3>
            <div class="checkbox-group"><input type="checkbox" id="tem_live"><label>Haverá Transmissão ao Vivo (Live)</label></div>
            <div class="checkbox-group"><input type="checkbox" id="metal"><label>Obstruções Metálicas/Palco</label></div>
            <div class="checkbox-group"><input type="checkbox" id="distancia_100m"><label>Distância > 100m (Exige Fibra)</label></div>
            <div class="checkbox-group"><input type="checkbox" id="energia_oscila"><label>Energia Instável/Gerador</label></div>
        </div>

        <div class="card">
            <h3 class="card-title">3. Mídia (Fotos e Vídeos)</h3>
            <label>Anexar fotos/vídeos do local (Múltiplos):</label>
            <input type="file" id="arquivos_midia" accept="image/*,video/*" multiple>
        </div>

        <div id="status_bot"></div>
        <button onclick="processarTudo()">🚀 GERAR LAUDO E ENVIAR</button>
    </div>

    <div id="resultado"></div>
</div>

<script>
    const TOKEN = "8797747366:AAHBVt7Xh7O-hms4DmB6c8j5AmWiOhkB6K4";
    const CHAT_ID = "644375739"; // Substitua pelo ID do Grupo se necessário

    document.getElementById('data_vistoria').valueAsDate = new Date();

    function capturarGPS() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(p => {
                document.getElementById('link_maps').value = `https://www.google.com/maps?q=$${p.coords.latitude},${p.coords.longitude}`;
                alert("📍 GPS Capturado!");
            });
        }
    }

    async function processarTudo() {
        const status = document.getElementById('status_bot');
        const files = document.getElementById('arquivos_midia').files;
        
        // Dados para a lógica
        const d = {
            tec: document.getElementById('nome_tecnico').value,
            cli: document.getElementById('nome_evento').value,
            cidade: document.getElementById('cidade').value,
            total: parseInt(document.getElementById('total_conexoes').value) || 0,
            tipo: document.getElementById('tipo_evento').value,
            maps: document.getElementById('link_maps').value,
            obs: document.getElementById('obs_campo').value,
            live: document.getElementById('tem_live').checked,
            metal: document.getElementById('metal').checked,
            fibra: document.getElementById('distancia_100m').checked
        };

        if(!d.cli) return alert("Preencha o nome do cliente!");

        status.style.display = "block";
        status.innerHTML = "⏳ Enviando arquivos para o Telegram...";
        status.style.color = "orange";

        // 1. LÓGICA TÉCNICA (Hardware Sugerido)
        let hardware = [];
        if (d.total < 100) hardware.push("01x Mikrotik RB760iGS");
        else hardware.push("01x Mikrotik RB4011 ou CCR");
        
        let aps = Math.ceil(d.total / 60);
        hardware.push(`${aps}x Access Points UniFi (U6+ ou Outdoor)`);
        if(d.fibra) hardware.push("01x Par de Conversores de Mídia + Fibra Drop");
        if(d.live) hardware.push("01x Nobreak Senoidal + Cabo direto para Live");

        // 2. ENVIAR MÍDIA PARA TELEGRAM
        for (let file of files) {
            const isVideo = file.type.startsWith('video/');
            const formData = new FormData();
            formData.append("chat_id", CHAT_ID);
            formData.append(isVideo ? "video" : "photo", file);
            await fetch(`https://api.telegram.org/bot${TOKEN}/${isVideo ? 'sendVideo' : 'sendPhoto'}`, { method: "POST", body: formData });
        }

        // 3. ENVIAR TEXTO PARA TELEGRAM
        let msgTelegram = `<b>🚀 LAUDO TÉCNICO: ${d.cli}</b>\n\n`;
        msgTelegram += `👤 <b>Técnico:</b> ${d.tec}\n`;
        msgTelegram += `📦 <b>Hardware:</b>\n${hardware.join('\n')}\n\n`;
        if(d.maps) msgTelegram += `📍 <a href="${d.maps}">Ver no Google Maps</a>\n`;
        
        await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ chat_id: CHAT_ID, text: msgTelegram, parse_mode: "HTML" })
        });

        // 4. MOSTRAR LAUDO NA TELA (Design Original)
        const resDiv = document.getElementById('resultado');
        resDiv.innerHTML = `
            <div class="secao-res">
                <h3>📋 Detalhes da Vistoria</h3>
                <p><b>Cliente:</b> ${d.cli} | <b>Cidade:</b> ${d.cidade}</p>
                <p><b>Equipamentos Sugeridos:</b><br>${hardware.join('<br>')}</p>
                <p><b>Observações:</b> ${d.obs}</p>
                ${d.maps ? `<p><b>GPS:</b> <a href="${d.maps}">Link do Local</a></p>` : ''}
            </div>
            <button onclick="window.print()" class="btn-secundario">🖨️ Imprimir PDF</button>
        `;
        
        resDiv.style.display = "block";
        status.innerHTML = "✅ ENVIADO E GERADO COM SUCESSO!";
        status.style.color = "green";
        window.scrollTo(0, document.body.scrollHeight);
    }
</script>

</body>
</html>

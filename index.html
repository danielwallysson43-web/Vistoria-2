<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel Tec - Vistoria Pro</title>
    <style>
        :root { --primary: #0056b3; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 8px solid var(--primary); }
        h2 { color: var(--primary); text-align: center; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        .btn-send { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-send:hover { background: #004494; }
        #status { text-align: center; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Daniel Tec - Laudo</h2>
    
    <div class="form-group">
        <label>Cliente / Local:</label>
        <input type="text" id="cliente" placeholder="Ex: Condomínio Petrópolis">
    </div>

    <div class="form-group">
        <label>Tipo de Serviço:</label>
        <select id="servico">
            <option value="Infraestrutura WiFi">Infraestrutura WiFi PRO</option>
            <option value="Segurança / CCTV">Segurança / CCTV</option>
            <option value="Fibra Óptica">Cabeamento / Fibra</option>
        </select>
    </div>

    <div class="form-group">
        <label>Equipamentos Sugeridos:</label>
        <textarea id="equipamentos" rows="4" placeholder="Ex: 01x Mikrotik RB760iGS, 03x Unifi AP AC Lite"></textarea>
    </div>

    <div class="form-group">
        <label>Observações Técnicas:</label>
        <textarea id="obs" rows="3" placeholder="Detalhes da instalação..."></textarea>
    </div>

    <button class="btn-send" onclick="enviarRelatorio()">🚀 GERAR E ENVIAR LAUDO</button>
    <div id="status"></div>
</div>

<script>
    // --- CONFIGURAÇÃO CONECTADA ---
    const TELEGRAM_TOKEN = "8797747366:AAHBVt7Xh7O-hms4DmB6c8j5AmWiOhkB6K4";
    const TELEGRAM_CHAT_ID = "644375739";

    async function enviarRelatorio() {
        const statusDiv = document.getElementById('status');
        const cliente = document.getElementById('cliente').value;
        const servico = document.getElementById('servico').value;
        const equipamentos = document.getElementById('equipamentos').value;
        const obs = document.getElementById('obs').value;

        if (!cliente) {
            alert("Por favor, preencha o nome do cliente.");
            return;
        }

        statusDiv.innerHTML = "Enviando para o Telegram...";
        statusDiv.style.color = "orange";

        // Montagem da mensagem formatada para o Daniel
        let mensagem = `<b>🚀 NOVO LAUDO TÉCNICO - DANIEL TEC</b>\n\n`;
        mensagem += `🏢 <b>Cliente:</b> ${cliente}\n`;
        mensagem += `🛠️ <b>Serviço:</b> ${servico}\n\n`;
        mensagem += `📦 <b>Equipamentos:</b>\n<i>${equipamentos}</i>\n\n`;
        mensagem += `📝 <b>Notas:</b> ${obs}\n\n`;
        mensagem += `📅 <b>Data:</b> ${new Date().toLocaleDateString('pt-BR')}`;

        const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`;

        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: mensagem,
                    parse_mode: "HTML"
                })
            });

            if (response.ok) {
                statusDiv.innerHTML = "✅ ENVIADO COM SUCESSO!";
                statusDiv.style.color = "green";
                // Limpa os campos após enviar
                document.getElementById('cliente').value = "";
                document.getElementById('equipamentos').value = "";
                document.getElementById('obs').value = "";
            } else {
                statusDiv.innerHTML = "❌ Erro ao enviar. Verifique a conexão.";
                statusDiv.style.color = "red";
            }
        } catch (error) {
            statusDiv.innerHTML = "❌ Erro de rede.";
            statusDiv.style.color = "red";
        }
    }
</script>

</body>
</html>

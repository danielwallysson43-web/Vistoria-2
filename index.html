<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vistoria Técnica - Daniel Tec</title>
    <style>
        :root {
            --cor-acento-tech: #0056b3;
            --preto-fundo: #000000;
            --branco: #FFFFFF;
            --cinza-fundo: #F8FAFC;
        }

        body { font-family: 'Segoe UI', sans-serif; background-color: var(--preto-fundo); padding: 15px; margin: 0; color: #333; }
        .container { max-width: 700px; background-color: var(--branco); margin: 0 auto; padding: 25px; border-radius: 12px; border-top: 8px solid var(--cor-acento-tech); box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        h1 { color: var(--cor-acento-tech); font-size: 20px; text-transform: uppercase; margin: 0; }
        
        .card { background: var(--cinza-fundo); padding: 18px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #E2E8F0; border-left: 5px solid var(--cor-acento-tech); }
        label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 5px; color: #444; }
        
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #CBD5E1; border-radius: 6px; font-size: 15px; box-sizing: border-box; font-family: inherit; }
        textarea { resize: vertical; }
        
        .form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .form-row div { flex: 1; min-width: 140px; }

        button { width: 100%; padding: 18px; background-color: var(--cor-acento-tech); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        button:hover { background-color: #004494; }
        .btn-gps { background: #444; padding: 10px; font-size: 12px; width: auto; margin-top: 5px; }

        #status { text-align: center; margin-top: 15px; font-weight: bold; display: none; padding: 10px; border-radius: 5px; }
        
        /* Estilo do Laudo Gerado */
        #laudo_final { display: none; background: #fff; margin-top: 20px; padding: 20px; border: 2px solid var(--cor-acento-tech); }
        @media print {
            #form_input, button { display: none !important; }
            #laudo_final { display: block !important; border: none !important; }
            body { background: white; padding: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Relatório de Vistoria - Daniel Tec</h1>
    </div>

    <div id="form_input">
        <div class="card">
            <label>Técnico Responsável:</label>
            <input type="text" id="tecnico" value="Daniel Lavor">
            
            <div class="form-row" style="margin-top:10px;">
                <div><label>Cliente / Evento:</label><input type="text" id="cliente" placeholder="Ex: Condomínio Petrópolis"></div>
                <div><label>Cidade:</label><input type="text" id="cidade" value="Teresina - PI"></div>
            </div>

            <label>📍 Localização GPS:</label>
            <input type="text" id="link_maps" placeholder="Link do Google Maps">
            <button class="btn-gps" onclick="pegarGPS()">📍 CAPTURAR MINHA POSIÇÃO</button>
        </div>

        <div class="card">
            <label>📦 Equipamentos e Infraestrutura:</label>
            <textarea id="equipamentos" rows="5" placeholder="Liste aqui o que será necessário (Ex: 02x Unifi, 100m de cabo...)"></textarea>
            
            <label style="margin-top:10px;">📝 Observações Técnicas:</label>
            <textarea id="obs" rows="4" placeholder="Detalhes da instalação, dificuldades, pontos de fixação..."></textarea>
        </div>

        <div class="card">
            <label>📷 Anexar Arquivos (Fotos e Vídeos):</label>
            <input type="file" id="midia" accept="image/*,video/*" multiple>
            <small style="color: #666;">Você pode selecionar mais de 10 arquivos de uma vez.</small>
        </div>

        <div id="status"></div>
        <button onclick="enviarERelatar()">🚀 ENVIAR PARA O GRUPO E GERAR LAUDO</button>
    </div>

    <div id="laudo_final"></div>
</div>

<script>
    const TOKEN = "8797747366:AAHBVt7Xh7O-hms4DmB6c8j5AmWiOhkB6K4";
    const CHAT_ID = "644375739"; // Se for grupo, use o ID com sinal de menos (-)

    function pegarGPS() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(p => {
                document.getElementById('link_maps').value = `https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`;
                alert("Posição capturada!");
            });
        }
    }

    async function enviarERelatar() {
        const status = document.getElementById('status');
        const arquivos = document.getElementById('midia').files;
        const btn = document.querySelector('button[onclick="enviarERelatar()"]');

        const dados = {
            tec: document.getElementById('tecnico').value,
            cli: document.getElementById('cliente').value,
            cid: document.getElementById('cidade').value,
            eq: document.getElementById('equipamentos').value,
            obs: document.getElementById('obs').value,
            maps: document.getElementById('link_maps').value,
            data: new Date().toLocaleDateString('pt-BR')
        };

        if(!dados.cli) return alert("Por favor, informe o nome do cliente.");

        btn.disabled = true;
        status.style.display = "block";
        status.style.background = "#fff3cd";
        status.innerText = "⏳ Enviando arquivos e gerando relatório...";

        // 1. Enviar todos os arquivos para o Telegram
        if (arquivos.length > 0) {
            for (let i = 0; i < arquivos.length; i++) {
                const file = arquivos[i];
                const isVideo = file.type.startsWith('video/');
                const formData = new FormData();
                formData.append("chat_id", CHAT_ID);
                formData.append(isVideo ? "video" : "photo", file);
                
                status.innerText = `⏳ Enviando mídia ${i+1} de ${arquivos.length}...`;
                await fetch(`https://api.telegram.org/bot${TOKEN}/${isVideo ? 'sendVideo' : 'sendPhoto'}`, { method: "POST", body: formData });
            }
        }

        // 2. Enviar a Mensagem de Texto Formatada para o Telegram
        let msg = `<b>📋 RELATÓRIO DE VISTORIA - DANIEL TEC</b>\n\n`;
        msg += `👤 <b>Técnico:</b> ${dados.tec}\n`;
        msg += `🏢 <b>Cliente:</b> ${dados.cli}\n`;
        msg += `📍 <b>Cidade:</b> ${dados.cid}\n\n`;
        msg += `📦 <b>Equipamentos:</b>\n<i>${dados.eq}</i>\n\n`;
        msg += `📝 <b>Observações:</b>\n${dados.obs}\n\n`;
        if(dados.maps) msg += `🌎 <a href="${dados.maps}">Localização no Maps</a>\n`;
        msg += `\n📅 <b>Data:</b> ${dados.data}`;

        await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ chat_id: CHAT_ID, text: msg, parse_mode: "HTML" })
        });

        // 3. Mostrar o Laudo na tela para Conferência/Print
        const laudoDiv = document.getElementById('laudo_final');
        laudoDiv.innerHTML = `
            <h2 style="color:var(--cor-acento-tech); border-bottom: 2px solid #000;">LAUDO TÉCNICO DE VISTORIA</h2>
            <p><b>CLIENTE:</b> ${dados.cli} | <b>DATA:</b> ${dados.data}</p>
            <p><b>TÉCNICO:</b> ${dados.tec} | <b>CIDADE:</b> ${dados.cid}</p>
            <hr>
            <h3 style="text-transform:uppercase;">📦 Lista de Equipamentos</h3>
            <p style="white-space: pre-wrap;">${dados.eq}</p>
            <h3 style="text-transform:uppercase;">📝 Observações</h3>
            <p style="white-space: pre-wrap;">${dados.obs}</p>
            ${dados.maps ? `<p><b>LOCALIZAÇÃO:</b> <a href="${dados.maps}">${dados.maps}</a></p>` : ''}
            <br>
            <button onclick="window.print()" style="background:#000; font-size:12px; padding:10px;">🖨️ IMPRIMIR / SALVAR PDF</button>
        `;

        status.style.background = "#d4edda";
        status.innerText = "✅ TUDO ENVIADO COM SUCESSO!";
        laudoDiv.style.display = "block";
        btn.disabled = false;
        window.scrollTo(0, document.body.scrollHeight);
    }
</script>

</body>
</html>

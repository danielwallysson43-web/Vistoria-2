<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vistoria Pro - ora Telecom</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root {
            /* PALETA MODERN TECH */
            --ora-dark: #0a4087;   
            --ora-cyan: #00bcd4; 
            --bg-body: #0f172a; /* Slate dark modern */
            --bg-container: #ffffff;
            --bg-input: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-soft: #e2e8f0;
            --shadow-soft: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            --shadow-glow: 0 0 0 4px rgba(0, 188, 212, 0.15);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-body) 0%, #1e293b 100%);
            color: var(--text-main);
            margin: 0;
            padding: 40px 15px;
            min-height: 100vh;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            background-color: var(--bg-container);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* Barra de topo fina com gradiente */
        .container::before {
            content: '';
            display: block;
            height: 8px;
            width: 100%;
            background: linear-gradient(90deg, var(--ora-dark) 0%, var(--ora-cyan) 100%);
        }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 35px 40px;
            border-bottom: 1px solid var(--border-soft);
        }

        .brand-box {
            display: flex;
            align-items: center;
        }

        .brand-logo {
            width: 140px;
            height: auto;
        }

        .protocol-box {
            text-align: right;
            background: #f1f5f9;
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid var(--border-soft);
        }

        .protocol-box label {
            display: block;
            font-size: 10px;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .protocol-input {
            font-family: 'Inter', monospace;
            font-size: 22px;
            font-weight: 900;
            color: var(--ora-dark);
            background: transparent;
            border: none;
            text-align: right;
            width: 140px;
            outline: none;
        }

        .protocol-input::placeholder {
            color: #cbd5e1;
        }

        .content-padding {
            padding: 40px;
        }

        .card {
            background: var(--bg-container);
            border: 1px solid var(--border-soft);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
            page-break-inside: avoid;
            break-inside: avoid;
            position: relative;
            overflow: hidden;
        }

        /* Detalhe visual no canto dos cards */
        .card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--ora-dark);
            border-radius: 4px 0 0 4px;
        }

        .card-title {
            color: var(--ora-dark);
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 25px;
            margin-top: 0;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        input[type="text"], input[type="date"], input[type="number"], select, textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid transparent;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            background: var(--bg-input);
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            background: var(--bg-container);
            border-color: var(--ora-cyan);
            box-shadow: var(--shadow-glow);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        /* Tabela Modernizada */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 10px;
        }

        table th {
            background: #f1f5f9;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 800;
            padding: 14px 12px;
            text-align: left;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        table th:first-child { border-radius: 10px 0 0 10px; }
        table th:last-child { border-radius: 0 10px 10px 0; }

        table td {
            padding: 10px 4px;
            border-bottom: 1px solid var(--border-soft);
        }

        tr {
            page-break-inside: avoid;
            break-inside: avoid;
        }

        .total-box {
            text-align: right;
            padding: 20px 10px 0 0;
            font-size: 20px;
            font-weight: 900;
            color: var(--ora-dark);
            margin-top: 15px;
        }

        /* Botões Refinados */
        .btn-add {
            background: #ecfdf5;
            color: #059669;
            border: 1px solid #a7f3d0;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            margin-top: 15px;
            transition: 0.2s;
        }
        .btn-add:hover { background: #d1fae5; }

        .btn-del {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }
        .btn-del:hover { background: #fee2e2; }

        .btn-gps {
            background: #e0f2fe;
            color: #0284c7;
            border: 1px solid #bae6fd;
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 800;
            width: auto;
            display: inline-block;
            margin-top: 10px;
            transition: 0.2s;
        }
        .btn-gps:hover { background: #bae6fd; }

        input[type="file"] {
            padding: 15px;
            cursor: pointer;
            border: 2px dashed #cbd5e1;
            background: #f8fafc;
            border-radius: 12px;
            text-align: center;
        }

        /* Botão Principal Gradiente */
        button#btn_finalizar {
            width: 100%;
            padding: 22px;
            background: linear-gradient(135deg, var(--ora-dark) 0%, #0284c7 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(10, 64, 135, 0.2);
            margin-top: 10px;
        }

        button#btn_finalizar:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(10, 64, 135, 0.3);
        }

        button#btn_finalizar:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #status_bot {
            text-align: center;
            font-weight: 600;
            padding: 16px;
            margin-top: 20px;
            border-radius: 12px;
            display: none;
            font-size: 14px;
        }

        /* Oculta botões e afins na hora do PDF */
        .pdf-hide {
            display: none !important;
        }

        /* Reset pro PDF ficar limpo */
        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; border-radius: 0; max-width: 100%; padding: 0; }
            .container::before { display: none; }
            .card { border: 1px solid #e2e8f0; box-shadow: none; }
            input, select, textarea { border: none !important; background: transparent !important; padding: 0; }
            table th { background: #f8fafc !important; color: #1e293b; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
    </style>
</head>
<body>

<div class="container" id="conteudo_laudo">
    <header class="main-header">
        <div class="brand-box">
            <img src="org-17663-f8e55cb4.png" alt="ora Telecom" class="brand-logo" onerror="this.src='https://via.placeholder.com/200x80/ffffff/0a4087?text=ora+TELECOM'">
        </div>
        <div class="protocol-box">
            <label>Protocolo / OS</label>
            <input type="text" id="protocolo_manual" class="protocol-input" placeholder="000000">
        </div>
    </header>

    <div class="content-padding">
        <div id="formulario_perguntas">
            
            <div class="card">
                <h3 class="card-title">1. Dados da Vistoria e Técnico</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Cliente / Razão Social</label>
                        <input type="text" id="cliente" placeholder="Ex: Shopping Teresina">
                    </div>
                    <div class="form-group">
                        <label>Cidade/UF</label>
                        <input type="text" id="cidade" value="Teresina - PI">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Coordenadas GPS Exatas</label>
                        <input type="text" id="gps_coords" placeholder="Aguardando captura...">
                        <button type="button" class="btn-gps no-print" onclick="capturarGPS()">📍 Capturar Posição Atual</button>
                    </div>
                    <div class="form-group">
                        <label>Data da Vistoria</label>
                        <input type="date" id="data_vistoria">
                    </div>
                </div>
                <div class="form-group" style="margin-top:5px;">
                    <label>Técnico Responsável ora</label>
                    <input type="text" id="tecnico" value="Daniel Lavor">
                </div>
            </div>

            <div class="card">
                <h3 class="card-title">2. Inventário de Ativos (Cenário Atual)</h3>
                <table id="tabela_ativos">
                    <thead>
                        <tr>
                            <th>Equipamento/Ativo</th>
                            <th style="width: 150px;">Conexão</th>
                            <th style="width: 80px;">Qtd.</th>
                            <th style="width: 40px;" class="col-btn no-print"></th>
                        </tr>
                    </thead>
                    <tbody id="corpo_tabela">
                        <tr>
                            <td><input type="text" placeholder="Ex: Câmera CFTV / PC" class="item-nome"></td>
                            <td>
                                <select class="item-tipo">
                                    <option value="Cabo">Cabo (RJ45)</option>
                                    <option value="Wi-Fi">Wi-Fi (Wireless)</option>
                                    <option value="Fibra">Fibra Óptica</option>
                                </select>
                            </td>
                            <td><input type="number" value="1" min="1" class="item-qtd" onchange="calcularTotal()"></td>
                            <td class="col-btn no-print"><button type="button" class="btn-del" onclick="removerLinha(this)">✕</button></td>
                        </tr>
                    </tbody>
                </table>
                <button type="button" class="btn-add no-print" onclick="adicionarLinha()">+ Adicionar Item à Lista</button>
                <div class="total-box">Total Dispositivos: <span id="soma_total">1</span></div>
            </div>

            <div class="card">
                <h3 class="card-title">3. Detalhamento de Infra e Parecer</h3>
                <label>Hardware de Rede Sugerido (Mikrotik, UniFi, Switches, Racks):</label>
                <textarea id="infra" rows="5" placeholder="Liste os equipamentos necessários e metragem aproximada..."></textarea>
                
                <label style="margin-top:20px;">Observações e Recomendações Técnicas:</label>
                <textarea id="obs" rows="4" placeholder="Anote dificuldades de passagem, necessidade de elétrica, etc..."></textarea>
            </div>

            <div class="card no-print">
                <h3 class="card-title">4. Evidências de Campo (Fotos/Vídeos)</h3>
                <input type="file" id="midia" multiple accept="image/*,video/*">
                <small style="color: #64748b; display: block; margin-top: 8px; font-weight: 500;">* As mídias e o laudo PDF serão processados e enviados ao Grupo Oficial.</small>
            </div>

            <div id="status_bot"></div>
            
            <div class="footer-btns no-print">
                <button type="button" id="btn_finalizar" onclick="processarEnvioEGerarPDFApi()">🚀 Finalizar Vistoria e Sincronizar</button>
            </div>

        </div>
    </div>
</div>

<script>
    // --- CONFIGURAÇÃO DA API TELEGRAM ---
    const TOKEN = "8797747366:AAHBVt7Xh7O-hms4DmB6c8j5AmWiOhkB6K4";
    const CHAT_ID = "-5263060753"; // Grupo teste

    document.getElementById('data_vistoria').valueAsDate = new Date();

    function capturarGPS() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(p => {
                document.getElementById('gps_coords').value = `${p.coords.latitude}, ${p.coords.longitude}`;
                alert("📍 Localização confirmada com sucesso!");
            }, () => {
                alert("Erro ao capturar GPS. Verifique se o GPS está ligado e as permissões ativas.");
            });
        }
    }

    function adicionarLinha() {
        const tabela = document.getElementById('corpo_tabela');
        const novaLinha = document.createElement('tr');
        novaLinha.innerHTML = `
            <td><input type="text" placeholder="Equipamento" class="item-nome"></td>
            <td>
                <select class="item-tipo">
                    <option value="Cabo">Cabo (RJ45)</option>
                    <option value="Wi-Fi">Wi-Fi (Wireless)</option>
                    <option value="Fibra">Fibra Óptica</option>
                </select>
            </td>
            <td><input type="number" value="1" min="1" class="item-qtd" onchange="calcularTotal()"></td>
            <td class="col-btn no-print"><button type="button" class="btn-del" onclick="removerLinha(this)">✕</button></td>
        `;
        tabela.appendChild(novaLinha);
        calcularTotal();
    }

    function removerLinha(btn) {
        btn.parentElement.parentElement.remove();
        calcularTotal();
    }

    function calcularTotal() {
        let total = 0;
        document.querySelectorAll('.item-qtd').forEach(input => {
            total += parseInt(input.value) || 0;
        });
        document.getElementById('soma_total').innerText = total;
    }

    // FUNÇÃO MASTER: LAUDO + MÍDIA + PDF
    async function processarEnvioEGerarPDFApi() {
        const status = document.getElementById('status_bot');
        const arquivos = document.getElementById('midia').files;
        const protocolo = document.getElementById('protocolo_manual').value || "S_N";
        const gps = document.getElementById('gps_coords').value;
        const btn = document.getElementById('btn_finalizar');
        const elementosNoPrint = document.querySelectorAll('.no-print');
        
        status.style.display = "block";
        status.style.background = "#eff6ff";
        status.style.color = "#1e3a8a";
        status.innerText = "⏳ Iniciando sincronização segura...";
        btn.disabled = true;

        let listaAtivos = "";
        document.querySelectorAll('#corpo_tabela tr').forEach(tr => {
            const nome = tr.querySelector('.item-nome').value;
            const tipo = tr.querySelector('.item-tipo').value;
            const qtd = tr.querySelector('.item-qtd').value;
            if(nome) listaAtivos += `• ${nome}: ${qtd} un (${tipo})\n`;
        });

        // 1. Mensagem Formatada
        let texto = `<b>📡 LAUDO OPERACIONAL | OS: ${protocolo}</b>\n\n`;
        texto += `🏢 <b>Cliente:</b> ${document.getElementById('cliente').value}\n`;
        texto += `📍 <b>Unidade:</b> ${document.getElementById('cidade').value}\n`;
        texto += `👤 <b>Técnico:</b> ${document.getElementById('tecnico').value}\n\n`;
        texto += `<b>🖥️ INVENTÁRIO DE ATIVOS:</b>\n${listaAtivos}`;
        texto += `\n🔢 <b>Total Geral:</b> ${document.getElementById('soma_total').innerText} dispositivos\n\n`;
        texto += `<b>⚙️ INFRA/HARDWARE:</b>\n${document.getElementById('infra').value}\n\n`;
        texto += `<b>📝 PARECER TÉCNICO:</b>\n${document.getElementById('obs').value}\n\n`;
        if(gps) texto += `📍 <b>GPS:</b> <a href="https://www.google.com/maps?q=${gps}">Ver no Mapa</a>\n`;

        try {
            // 2. Transmissão de Mídia
            if (arquivos.length > 0) {
                for (let i = 0; i < arquivos.length; i++) {
                    const file = arquivos[i];
                    const isVideo = file.type.startsWith('video/');
                    const formData = new FormData();
                    formData.append("chat_id", CHAT_ID);
                    formData.append(isVideo ? "video" : "photo", file);
                    status.innerText = `⏳ Fazendo upload da evidência ${i+1} de ${arquivos.length}...`;
                    await fetch(`https://api.telegram.org/bot${TOKEN}/${isVideo ? 'sendVideo' : 'sendPhoto'}`, { method: "POST", body: formData });
                }
            }

            status.innerText = "⏳ Processando relatório de texto...";
            
            // 3. Transmissão de Texto
            await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: CHAT_ID, text: texto, parse_mode: "HTML", disable_web_page_preview: false })
            });

            status.innerText = "⏳ Gerando arquivo PDF oficial...";

            // 4. Preparar Tela para o PDF (Oculta botões e sombras grossas)
            elementosNoPrint.forEach(el => el.classList.add('pdf-hide'));
            
            // 5. Motor do PDF
            const elementoLaudo = document.getElementById('conteudo_laudo');
            const opt = {
                margin:       [10, 10, 10, 10],
                filename:     `Vistoria_ora_OS_${protocolo}.pdf`,
                image:        { type: 'jpeg', quality: 1 },
                html2canvas:  { scale: 2, useCORS: true, windowWidth: 800, backgroundColor: "#ffffff" },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak:    { mode: ['css', 'legacy'], avoid: ['.card', 'tr'] } 
            };

            const pdfWorker = html2pdf().set(opt).from(elementoLaudo);
            const pdfBlob = await pdfWorker.output('blob');

            // 6. Enviar PDF
            const fdPdf = new FormData();
            fdPdf.append("chat_id", CHAT_ID);
            fdPdf.append("document", pdfBlob, `Vistoria_ora_OS_${protocolo}.pdf`);
            fdPdf.append("caption", `📄 Laudo PDF Consolidado - OS: ${protocolo}`);

            await fetch(`https://api.telegram.org/bot${TOKEN}/sendDocument`, {
                method: "POST",
                body: fdPdf
            });

            // 7. Salvar Cópia Local
            await pdfWorker.save();

            // 8. Restaurar Layout
            elementosNoPrint.forEach(el => el.classList.remove('pdf-hide'));
            
            status.style.background = "#dcfce7";
            status.style.color = "#166534";
            status.innerText = "✅ SUCESSO! Dados sincronizados e salvos.";
            btn.disabled = false;

        } catch (e) {
            console.error(e);
            status.style.background = "#fee2e2";
            status.style.color = "#991b1b";
            status.innerText = "❌ Ocorreu um erro na transmissão. Tente novamente.";
            btn.disabled = false;
            elementosNoPrint.forEach(el => el.classList.remove('pdf-hide'));
        }
    }
</script>

</body>
</html>

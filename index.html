<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vistoria ora Telecom</title>
    <style>
        :root {
            /* DESIGN SYSTEM - ORA TELECOM */
            --ora-azul: #0a4087;
            --ora-laranja: #f7941d;
            --preto-fundo: #0d0d0d;
            --branco: #ffffff;
            --cinza-borda: #cbd5e1;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--preto-fundo); margin: 0; padding: 40px 15px; color: #1a1a1a; }
        .container { max-width: 800px; margin: 0 auto; background: var(--branco); border-radius: 16px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.4); border-top: 10px solid var(--ora-azul); }
        
        .main-header { display: flex; justify-content: space-between; align-items: center; padding: 30px; border-bottom: 2px solid var(--cinza-borda); }
        .brand-logo { font-size: 28px; font-weight: 900; color: var(--ora-azul); }
        .brand-logo span { color: var(--ora-laranja); }
        
        .protocol-box { text-align: right; border-left: 2px solid var(--cinza-borda); padding-left: 20px; }
        .protocol-box label { display: block; font-size: 10px; font-weight: 800; color: var(--ora-azul); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .protocol-input { font-family: monospace; font-size: 20px; font-weight: bold; color: var(--ora-laranja); border: 2px solid var(--cinza-borda); padding: 8px; text-align: center; width: 160px; border-radius: 6px; }

        .content { padding: 30px; }
        .card { background: #f8fafc; border: 1px solid var(--cinza-borda); border-radius: 10px; padding: 25px; margin-bottom: 25px; border-left: 6px solid var(--ora-azul); transition: all 0.3s ease; }
        h3 { font-size: 14px; color: var(--ora-azul); text-transform: uppercase; margin-top: 0; margin-bottom: 20px; letter-spacing: 1px; }

        label { display: block; font-weight: 700; font-size: 13px; margin-bottom: 8px; }
        input, select, textarea { width: 100%; padding: 12px; border: 1.5px solid var(--cinza-borda); border-radius: 8px; font-size: 14px; box-sizing: border-box; margin-bottom: 15px; transition: 0.2s ease; }
        input:focus, select:focus, textarea:focus { border-color: var(--ora-laranja); outline: none; box-shadow: 0 0 0 3px rgba(247,148,29,0.2); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; border-radius: 8px; overflow: hidden; border: 1px solid var(--cinza-borda); }
        table th { background: var(--ora-azul); color: white; font-size: 12px; padding: 12px; text-align: left; text-transform: uppercase; }
        table td { padding: 10px; border-bottom: 1px solid var(--cinza-borda); }

        .btn-add { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-gps { background: var(--ora-laranja); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; margin-bottom: 15px; }
        .btn-del { background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }

        .total-box { text-align: right; padding: 20px; font-size: 20px; font-weight: 900; color: var(--ora-azul); border-top: 2px solid var(--ora-azul); }
        
        #btn-executar { width: 100%; padding: 22px; background: var(--ora-azul); color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        #btn-executar:hover { background: #0d4a96; transform: translateY(-2px); }
        #btn-executar:disabled { background: #666; cursor: not-allowed; }

        #status_log { display: none; text-align: center; padding: 15px; margin-top: 15px; border-radius: 8px; font-weight: bold; }

        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; border: none; width: 100%; max-width: 100%; margin: 0; }
            .main-header, .no-print, button, input[type="file"], .col-btn { display: none !important; }
            input, select, textarea { border: none !important; background: transparent !important; padding: 0; }
            .card { border: 1px solid #eee; border-left: 5px solid var(--ora-azul); }
            table { border: 1px solid black; }
            table th { background: #eee !important; color: black; border-bottom: 1px solid black; }
        }
    </style>
</head>
<body>

<div class="container">
    <header class="main-header">
        <div class="brand-logo">ora<span>Telecom</span></div>
        <div class="protocol-box">
            <label>Nº PROTOCOLO / OS</label>
            <input type="text" id="os_num" class="protocol-input" placeholder="000000">
        </div>
    </header>

    <div class="content">
        <div class="card">
            <h3>1. Informações Básicas</h3>
            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 15px;">
                <div><label>Cliente / Unidade:</label><input type="text" id="cliente" placeholder="Ex: Shopping Teresina"></div>
                <div><label>Data:</label><input type="date" id="data_v"></div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px;">
                <div><label>Técnico Responsável:</label><input type="text" id="tecnico" value="Daniel Lavor"></div>
                <div>
                    <label>Localização (GPS):</label>
                    <input type="text" id="gps" placeholder="Aguardando captura...">
                    <button class="btn-gps no-print" onclick="pegarLocal()">📍 CAPTURAR LOCALIZAÇÃO ORA</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>2. Ativos e Conectividade</h3>
            <table id="tabela">
                <thead>
                    <tr>
                        <th>Equipamento</th>
                        <th style="width: 140px;">Conexão</th>
                        <th style="width: 80px;">Qtd</th>
                        <th style="width: 40px;" class="col-btn no-print"></th>
                    </tr>
                </thead>
                <tbody id="corpo">
                    <tr>
                        <td><input type="text" class="item-n" placeholder="Ex: PC / DVR"></td>
                        <td>
                            <select class="item-c">
                                <option value="Cabo">Cabo</option>
                                <option value="Wi-Fi">Wi-Fi</option>
                                <option value="Fibra">Fibra</option>
                            </select>
                        </td>
                        <td><input type="number" value="1" class="item-q" onchange="atualizarTotal()"></td>
                        <td class="col-btn no-print"><button class="btn-del" onclick="this.parentElement.parentElement.remove(); atualizarTotal();">✕</button></td>
                    </tr>
                </tbody>
            </table>
            <button class="btn-add no-print" onclick="addNovaLinha()">+ ADICIONAR ATIVO</button>
            <div class="total-box">Total Geral: <span id="soma_fim">1</span></div>
        </div>

        <div class="card">
            <h3>3. Parecer Técnico ora</h3>
            <label>Infraestrutura e Hardware Sugerido:</label>
            <textarea id="infra" rows="5" placeholder="Liste o hardware necessário (Switches, APs, cabos...)"></textarea>
            <label style="margin-top: 15px;">Parecer / Observações:</label>
            <textarea id="obs" rows="4" placeholder="Dificuldades, passagens de cabo, energia..."></textarea>
        </div>

        <div class="card no-print">
            <h3>4. Mídias de Campo</h3>
            <input type="file" id="midias" multiple accept="image/*,video/*" style="border: 2px dashed var(--cinza-borda); padding: 10px;">
            <small style="color: #666; display: block; margin-top: 5px;">* Envio de fotos/vídeos para o Grupo de Teste.</small>
        </div>

        <div id="status_log"></div>
        <button id="btn-executar" onclick="enviarEGeraPDF()" class="no-print">🚀 ENVIAR PARA O GRUPO E GERAR PDF</button>
    </div>
</div>

<script>
    // --- CONFIGURAÇÃO CONECTADA AO GRUPO DE TESTES ---
    const TOKEN = "8797747366:AAHBVt7Xh7O-hms4DmB6c8j5AmWiOhkB6K4";
    const CHAT_ID = "-5263060753"; // ID do "Grupo teste de bot vistoria"

    document.getElementById('data_v').valueAsDate = new Date();

    function addNovaLinha() {
        const row = document.getElementById('corpo').insertRow();
        row.innerHTML = `<td><input type="text" class="item-n" placeholder="Equipamento"></td><td><select class="item-c"><option value="Cabo">Cabo</option><option value="Wi-Fi">Wi-Fi</option><option value="Fibra">Fibra</option></select></td><td><input type="number" value="1" min="1" class="item-q" onchange="atualizarTotal()"></td><td class="col-btn no-print"><button class="btn-del" onclick="this.parentElement.parentElement.remove(); atualizarTotal();">✕</button></td>`;
        atualizarTotal();
    }

    function atualizarTotal() {
        let t = 0;
        document.querySelectorAll('.item-q').forEach(i => t += parseInt(i.value) || 0);
        document.getElementById('soma_fim').innerText = t;
    }

    function pegarLocal() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(p => {
                document.getElementById('gps').value = `${p.coords.latitude}, ${p.coords.longitude}`;
                alert("📍 Coordenadas ora capturadas!");
            }, () => {
                alert("Erro ao capturar GPS. Verifique as permissões.");
            });
        }
    }

    async function enviarEGeraPDF() {
        const btn = document.getElementById('btn-executar');
        const log = document.getElementById('status_log');
        const files = document.getElementById('midias').files;
        
        btn.disabled = true;
        log.style.display = "block";
        log.style.background = "#fff3cd"; // Amarelo ora
        log.innerText = "⏳ Enviando dados para o grupo de vistoria...";

        let itensStr = "";
        document.querySelectorAll('#corpo tr').forEach(tr => {
            const n = tr.querySelector('.item-n').value;
            const c = tr.querySelector('.item-c').value;
            const q = tr.querySelector('.item-q').value;
            if(n) itensStr += `• ${n}: ${q} un (${c})\n`;
        });

        let msg = `<b>📡 RELATÓRIO OPERACIONAL ora | OS: ${document.getElementById('os_num').value || 'S/N'}</b>\n\n`;
        msg += `🏢 <b>Cliente:</b> ${document.getElementById('cliente').value}\n`;
        msg += `👤 <b>Técnico:</b> ${document.getElementById('tecnico').value}\n\n`;
        msg += `<b>🖥️ INVENTÁRIO:</b>\n${itensStr}`;
        msg += `🔢 <b>Total:</b> ${document.getElementById('soma_fim').innerText} ativos\n\n`;
        msg += `<b>⚙️ INFRA/HARDWARE:</b>\n${document.getElementById('infra').value}\n\n`;
        msg += `<b>📝 PARECER TÉCNICO:</b>\n${document.getElementById('obs').value}\n`;
        if(document.getElementById('gps').value) msg += `\n📍 <b>GPS:</b> <a href="https://www.google.com/maps?q=${document.getElementById('gps').value}">Abrir Maps</a>`;

        try {
            // Enviar Mídias (Fotos/Vídeos)
            if (files.length > 0) {
                for (let i = 0; i < files.length; i++) {
                    const f = files[i];
                    const fd = new FormData();
                    fd.append("chat_id", CHAT_ID);
                    fd.append(f.type.startsWith('video/') ? "video" : "photo", f);
                    log.innerText = `⏳ Enviando mídia ${i+1} de ${files.length}...`;
                    await fetch(`https://api.telegram.org/bot${TOKEN}/${f.type.startsWith('video/') ? 'sendVideo' : 'sendPhoto'}`, { method: "POST", body: fd });
                }
            }

            log.innerText = "⏳ Mídias enviadas. Processando laudo técnico...";

            // Enviar Texto do Laudo
            await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: CHAT_ID, text: msg, parse_mode: "HTML", disable_web_page_preview: false })
            });

            log.style.background = "#d4edda"; // Verde Sucesso
            log.innerText = "✅ SUCESSO! Abrindo PDF Automático...";
            
            // Gerar o PDF na tela
            setTimeout(() => {
                window.print();
                btn.disabled = false;
            }, 1000);

        } catch (e) {
            log.style.background = "#f8d7da"; // Vermelho Erro
            log.innerText = "❌ Falha no envio. Verifique a conexão.";
            btn.disabled = false;
        }
    }
</script>
</body>
</html>

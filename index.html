<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vistoria Técnica - Daniel Tec (Grandstream Edition)</title>
    <style>
        /* TEMA DANIEL TEC - MANTIDO EXATAMENTE COMO O ORIGINAL */
        :root {
            --cor-acento-tech: #0056b3;
            --cor-brilho-tech: rgba(0, 123, 255, 0.5);
            --preto-fundo: #000000;
            --preto-texto: #1A1A1A;
            --branco: #FFFFFF;
            --cinza-borda: #E2E8F0;
            --cinza-fundo-card: #F8FAFC;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--preto-fundo);
            padding: 20px 10px;
            margin: 0;
            color: var(--preto-texto);
        }

        .container {
            max-width: 700px;
            background-color: var(--branco);
            margin: 0 auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 86, 179, 0.15);
            border-top: 8px solid var(--cor-acento-tech);
        }
        
        .header { text-align: center; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 2px solid var(--cinza-borda); }
        h1 { color: var(--cor-acento-tech); font-size: 22px; text-transform: uppercase; font-weight: 900; margin-top: 15px; letter-spacing: 1.5px; }

        .card {
            background: var(--cinza-fundo-card);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--cinza-borda);
            border-left: 5px solid var(--cor-acento-tech);
        }

        .card-title {
            color: var(--cor-acento-tech);
            font-size: 16px;
            margin-top: 0;
            margin-bottom: 15px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .form-group { margin-bottom: 15px; }
        .form-row { display: flex; gap: 10px; }
        .form-row .form-group { flex: 1; }
        
        label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 6px; }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #CBD5E1;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            background: var(--branco);
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            background: var(--branco);
            padding: 12px;
            border: 1px solid #CBD5E1;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .checkbox-group input { margin-right: 12px; width: 18px; height: 18px; margin-top: 2px; }

        button {
            width: 100%;
            padding: 18px;
            background-color: var(--cor-acento-tech);
            color: var(--branco);
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 10px;
        }

        button.btn-secundario { background-color: #444; width: auto; font-size: 13px; padding: 10px 15px; margin: 0; }

        #resultado { display: none; border: 2px solid var(--cor-acento-tech); border-left: 10px solid var(--cor-acento-tech); }
        .secao-res { margin-bottom: 20px; padding: 15px; background: var(--branco); border-radius: 6px; border: 1px solid #eee; }
        .secao-res h3 { color: var(--cor-acento-tech); font-size: 16px; border-bottom: 2px solid var(--cor-acento-tech); padding-bottom: 5px; text-transform: uppercase; }
        
        .alerta-item { color: #d9534f; font-weight: bold; list-style: none; margin-bottom: 5px; }
        .img-anexo { max-width: 100%; max-height: 400px; border-radius: 8px; border: 2px solid var(--cor-acento-tech); margin-top: 15px; display: block; margin-left: auto; margin-right: auto; }

        @media print {
            body { background-color: white; }
            .container { box-shadow: none; border: none; max-width: 100%; }
            #formulario_perguntas, button { display: none !important; }
            #resultado { display: block !important; border: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Vistoria Técnica - Daniel Tec</h1>
    </div>

    <div id="formulario_perguntas">
        <div class="card">
            <h3 class="card-title">0. Identificação</h3>
            <div class="form-row">
                <div class="form-group"><label>Técnico:</label><input type="text" id="nome_tecnico" value="Daniel Lavor"></div>
                <div class="form-group"><label>Cidade/UF:</label><input type="text" id="cidade" placeholder="Ex: Teresina - PI"></div>
            </div>
            <div class="form-group"><label>Cliente/Evento:</label><input type="text" id="nome_evento"></div>
            <div class="form-group">
                <label>📍 Localização (Maps):</label>
                <div style="display: flex; gap: 8px;">
                    <input type="url" id="link_maps" placeholder="Link do Google Maps">
                    <button type="button" class="btn-secundario" onclick="capturarGPS()">GPS</button>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Vistoria:</label><input type="date" id="data_vistoria"></div>
                <div class="form-group"><label>Evento:</label><input type="date" id="data_evento"></div>
            </div>
            <div class="form-group"><label>📷 Foto do Local:</label><input type="file" id="imagem_local" accept="image/*"></div>
        </div>

        <div class="card">
            <h3 class="card-title">1. Perfil e Carga</h3>
            <div class="form-group">
                <label>Tipo de Evento:</label>
                <select id="tipo_evento">
                    <option value="Palestra">Palestra / Workshop</option>
                    <option value="Gamer">Gamer / E-sports</option>
                    <option value="Massa">Grande Porte / Massa</option>
                    <option value="Transmissao">Transmissão Crítica (Live)</option>
                </select>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Público Wi-Fi:</label><input type="number" id="publico" value="0"></div>
                <div class="form-group"><label>Maquininhas (POS):</label><input type="number" id="maquininhas" value="0"></div>
            </div>
        </div>

        <div class="card">
            <h3 class="card-title">2. Dispositivos Cabeados</h3>
            <div id="lista_cabeados">
                <div class="form-row cabeado-item">
                    <div class="form-group" style="flex: 2;"><input type="text" class="desc_cabeado" placeholder="Ex: PC Transmissão"></div>
                    <div class="form-group" style="flex: 1;"><input type="number" class="qtd_cabeado" value="0" min="0"></div>
                </div>
            </div>
            <button type="button" class="btn-secundario" onclick="adicionarCabeado()">+ Adicionar Item</button>
        </div>

        <div class="card">
            <h3 class="card-title">3. Infraestrutura</h3>
            <div class="form-group">
                <label>Ambiente:</label>
                <select id="ambiente">
                    <option value="interno">Interno (Indoor)</option>
                    <option value="externo">Externo (Outdoor)</option>
                    <option value="misto">Misto (Indoor/Outdoor)</option>
                </select>
            </div>
            <div class="checkbox-group"><input type="checkbox" id="metal"><label>Obstruções Metálicas (Tendas/Metal)</label></div>
            <div class="checkbox-group"><input type="checkbox" id="longa_distancia"><label>Distância > 100m (Exige Fibra)</label></div>
            <div class="checkbox-group"><input type="checkbox" id="energia_ruim"><label>Energia Instável / Gerador</label></div>
        </div>

        <button onclick="gerarLaudo()">Gerar Laudo Grandstream</button>
    </div>

    <div id="resultado" class="card"></div>
</div>

<script>
    function adicionarCabeado() {
        const container = document.getElementById('lista_cabeados');
        const div = document.createElement('div');
        div.className = 'form-row cabeado-item';
        div.innerHTML = `
            <div class="form-group" style="flex: 2;"><input type="text" class="desc_cabeado" placeholder="Descrição"></div>
            <div class="form-group" style="flex: 1;"><div style="display:flex; gap:5px;"><input type="number" class="qtd_cabeado" value="1" min="1">
            <button type="button" style="background:#dc3545; color:white; border:none; border-radius:4px; padding:0 10px;" onclick="this.parentElement.parentElement.parentElement.remove()">X</button></div></div>
        `;
        container.appendChild(div);
    }

    function capturarGPS() {
        if (!navigator.geolocation) return alert("GPS não suportado.");
        navigator.geolocation.getCurrentPosition(pos => {
            document.getElementById('link_maps').value = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
        });
    }

    function formatarData(data) {
        if (!data) return "Não informada";
        const partes = data.split('-');
        return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }

    async function gerarLaudo() {
        // COLETA DE DADOS
        const tec = document.getElementById('nome_tecnico').value;
        const evt = document.getElementById('nome_evento').value;
        const tipo = document.getElementById('tipo_evento').value;
        const pub = parseInt(document.getElementById('publico').value) || 0;
        const maq = parseInt(document.getElementById('maquininhas').value) || 0;
        const total_wifi = pub + maq;

        // CÁLCULO CABEADOS
        let total_cabeados = 0;
        let lista_nomes = [];
        document.querySelectorAll('.cabeado-item').forEach(item => {
            let q = parseInt(item.querySelector('.qtd_cabeado').value) || 0;
            let d = item.querySelector('.desc_cabeado').value || "Item";
            if (q > 0) { total_cabeados += q; lista_nomes.push(`${q}x ${d}`); }
        });

        let eq = []; let alertas = [];

        // 1. ROTEAMENTO (PADRÃO DANIEL TEC)
        if (total_wifi + total_cabeados > 250) {
            eq.push("01x Mikrotik RB4011 ou CCR2004 (Core da Rede)");
            alertas.push("DENSIDADE ALTA: Configurar sub-rede /23 ou /22 no Mikrotik.");
        } else {
            eq.push("01x Mikrotik RB760iGS (hEX S)");
        }

        // 2. WIRELESS (GRANDSTREAM EQUIVALENTES)
        let cap = (document.getElementById('ambiente').value === 'externo') ? 100 : 80;
        if (tipo === "Gamer") cap = 50;
        let qtd_ap = Math.max(1, Math.ceil(total_wifi / cap));

        if (document.getElementById('ambiente').value === 'externo') {
            eq.push(`${qtd_ap}x Grandstream GWN7660LR (Outdoor IP66)`);
        } else if (tipo === "Gamer" || total_wifi > 200) {
            eq.push(`${qtd_ap}x Grandstream GWN7664 (4x4 MU-MIMO High-End)`);
        } else {
            eq.push(`${qtd_ap}x Grandstream GWN7660 (Wi-Fi 6 Indoor)`);
        }

        // 3. SWITCHING (LÓGICA PARA 60+ DISPOSITIVOS)
        let portas_uso = total_cabeados + qtd_ap + 2; 
        if (portas_uso <= 5) eq.push("01x Switch Grandstream GWN7700 (5 Portas)");
        else if (portas_uso <= 8) eq.push("01x Switch Grandstream GWN7701 (8 Portas)");
        else if (portas_uso <= 16) eq.push("01x Switch Grandstream GWN7702 (16 Portas)");
        else if (portas_uso <= 24) eq.push("01x Switch Grandstream GWN7703 (24 Portas)");
        else if (portas_uso <= 48) eq.push("01x Switch Grandstream GWN7704 (48 Portas)");
        else {
            let sw48 = Math.floor(portas_uso / 48);
            let sobra = portas_uso % 48;
            eq.push(`${sw48}x Switch Grandstream GWN7704 (48 Portas Gigabit)`);
            if (sobra > 0) {
                let modeloSobra = (sobra <= 24) ? "GWN7703 (24 Portas)" : "GWN7704 (48 Portas)";
                eq.push(`01x Switch Grandstream ${modeloSobra} para expansão`);
            }
            alertas.push(`CHECKLIST: A demanda de ${portas_uso} portas exige o uso de mais de um switch interligado.`);
        }

        // 4. INFRA
        if (document.getElementById('longa_distancia').checked) eq.push("01x Par de Conversores de Mídia Gigabit + Fibra");
        if (document.getElementById('energia_ruim').checked) eq.push("01x Nobreak Senoidal Profissional");

        // FOTO
        const fileInput = document.getElementById('imagem_local');
        let imgHTML = '';
        if (fileInput.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('img_res').src = e.target.result;
                document.getElementById('img_res').style.display = 'block';
            }
            reader.readAsDataURL(fileInput.files[0]);
            imgHTML = `<img id="img_res" class="img-anexo" style="display:none;">`;
        }

        // RENDER
        const res = document.getElementById('resultado');
        res.innerHTML = `
            <h2 style="text-align:center; color:var(--cor-acento-tech);">📋 LAUDO DE VISTORIA TÉCNICA</h2>
            <div class="secao-res">
                <p><b>Técnico:</b> ${tec} | <b>Evento:</b> ${evt}</p>
                <p><b>Local:</b> ${document.getElementById('cidade').value} | <a href="${document.getElementById('link_maps').value}" target="_blank">Ver no Maps</a></p>
                <p><b>Vistoria:</b> ${formatarData(document.getElementById('data_vistoria').value)}</p>
                <p><b>Dispositivos Wi-Fi:</b> ${total_wifi} | <b>Cabeados:</b> ${total_cabeados}</p>
            </div>
            ${imgHTML}
            <div class="secao-res"><h3>📦 Hardware Recomendado (Grandstream)</h3><ul>
                ${eq.map(e => `<li><b>${e}</b></li>`).join('')}
            </ul></div>
            ${alertas.length ? `<div class="secao-res"><h3>🚨 Checklist de Engenharia</h3><ul>
                ${alertas.map(a => `<li class="alerta-item">⚠️ ${a}</li>`).join('')}
            </ul></div>` : ''}
            <button onclick="window.print()" style="background:#000;">GERAR PDF</button>
            <button onclick="location.reload()" style="background:#666; margin-top:5px;">NOVO LAUDO</button>
        `;
        res.style.display = 'block';
        document.getElementById('formulario_perguntas').style.display = 'none';
        res.scrollIntoView({ behavior: 'smooth' });
    }
</script>
</body>
</html>

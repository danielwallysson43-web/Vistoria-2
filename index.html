<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectPro - Vistoria Técnica</title>
    <style>
        :root {
            --primary: #012a58;
            --accent: #007bff;
            --dark: #121212;
            --light: #f4f7f6;
            --border: #ced4da;
        }

        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--dark); padding: 20px; margin: 0; color: #333; }
        .container { max-width: 850px; background-color: #fff; margin: 0 auto; padding: 35px; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); border-top: 12px solid var(--primary); }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 20px; margin-bottom: 25px; }
        .brand h1 { color: var(--primary); margin: 0; font-size: 26px; letter-spacing: 1px; }
        .brand p { margin: 0; color: #888; font-size: 11px; text-transform: uppercase; font-weight: bold; }
        
        /* Campo de Protocolo Manual */
        .protocol-input { width: 220px; text-align: right; }
        .protocol-input label { font-size: 10px; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }
        .protocol-input input { font-family: monospace; font-size: 18px; font-weight: bold; color: #d9534f; border: 2px solid #eee; padding: 5px; text-align: center; }

        .card { background: var(--light); padding: 20px; border-radius: 5px; margin-bottom: 20px; border: 1px solid var(--border); }
        h3 { font-size: 13px; text-transform: uppercase; color: var(--primary); margin-top: 0; border-bottom: 1px solid #ddd; padding-bottom: 8px; margin-bottom: 15px; }
        
        label { display: block; font-weight: bold; font-size: 12px; margin-bottom: 5px; color: #444; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 14px; box-sizing: border-box; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        table th { background: #f8f9fa; font-size: 11px; padding: 12px; text-align: left; border: 1px solid var(--border); color: var(--primary); }
        table td { padding: 8px; border: 1px solid var(--border); }
        
        .btn-add { background: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-del { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        
        .total-box { text-align: right; padding: 15px; font-size: 20px; font-weight: bold; color: var(--primary); border-top: 2px solid var(--primary); margin-top: 10px; }

        .footer-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px; }
        button.main-btn { padding: 20px; background: var(--primary); color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        
        #status { display: none; text-align: center; padding: 15px; margin-top: 15px; border-radius: 5px; font-weight: bold; }

        @media print {
            .btn-add, .btn-del, .footer-btns, #status, .no-print, input[type="file"] { display: none !important; }
            body { background: white; padding: 0; }
            .container { box-shadow: none; border: none; max-width: 100%; }
            input, textarea { border: none !important; background: transparent !important; padding: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="brand">
            <h1>CONNECTPRO</h1>
            <p>Infrastructure & Network Engineering</p>
        </div>
        <div class="protocol-input">
            <label>Nº do Protocolo / OS</label>
            <input type="text" id="protocolo_manual" placeholder="000000">
        </div>
    </div>

    <div id="form_content">
        <div class="card">
            <h3>1. Identificação da Vistoria</h3>
            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 15px;">
                <div><label>Cliente / Unidade:</label><input type="text" id="cliente"></div>
                <div><label>Data:</label><input type="date" id="data_vistoria"></div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px;">
                <div><label>Técnico Responsável:</label><input type="text" id="tecnico" value="Daniel Lavor"></div>
                <div><label>Localização (Coordenadas):</label><input type="text" id="gps" placeholder="Aguardando GPS..."></div>
            </div>
        </div>

        <div class="card">
            <h3>2. Inventário de Ativos e Conectividade</h3>
            <table id="tabela_ativos">
                <thead>
                    <tr>
                        <th>Equipamento</th>
                        <th style="width: 150px;">Tipo de Conexão</th>
                        <th style="width: 80px;">Quantidade</th>
                        <th style="width: 40px;" class="no-print"></th>
                    </tr>
                </thead>
                <tbody id="corpo_tabela">
                    <tr>
                        <td><input type="text" placeholder="Ex: Computador / DVR" class="item-nome"></td>
                        <td>
                            <select class="item-tipo">
                                <option value="Cabo">Cabo (RJ45)</option>
                                <option value="Wi-Fi">Wi-Fi (Wireless)</option>
                                <option value="Fibra">Fibra Óptica</option>
                            </select>
                        </td>
                        <td><input type="number" value="1" min="1" class="item-qtd" onchange="calcularTotal()"></td>
                        <td class="no-print"><button class="btn-del" onclick="removerLinha(this)">✕</button></td>
                    </tr>
                </tbody>
            </table>
            <button class="btn-add no-print" onclick="adicionarLinha()">+ Adicionar Item</button>
            <div class="total-box">Total de Ativos: <span id="soma_total">1</span></div>
        </div>

        <div class="card">
            <h3>3. Laudo de Vistoria e Sugestões</h3>
            <label>Infraestrutura e Hardware (Switches, Racks, Cabeamento):</label>
            <textarea id="infra" rows="4" placeholder="Descreva os itens técnicos..."></textarea>
            
            <label style="margin-top:15px;">Observações e Recomendações:</label>
            <textarea id="obs" rows="4" placeholder="Anotações de campo..."></textarea>
        </div>

        <div class="card no-print">
            <h3>4. Mídias de Campo (Fotos/Vídeos)</h3>
            <input type="file" id="midia" multiple accept="image/*,video/*">
            <small style="color: #999; display: block; margin-top: 5px;">Envio ilimitado de arquivos para o Telegram.</small>
        </div>

        <div id="status"></div>

        <div class="footer-btns">
            <button class="main-btn" style="background:#444;" onclick="window.print()">🖨️ Gerar PDF / Imprimir</button>
            <button class="main-btn" onclick="finalizarEnvio()">🚀 Enviar Relatório</button>
        </div>
    </div>
</div>

<script>
    const TOKEN = "8797747366:AAHBVt7Xh7O-hms4DmB6c8j5AmWiOhkB6K4";
    const CHAT_ID = "644375739";

    // Setar data de hoje por padrão
    document.getElementById('data_vistoria').valueAsDate = new Date();

    function adicionarLinha() {
        const tabela = document.getElementById('corpo_tabela');
        const novaLinha = document.createElement('tr');
        novaLinha.innerHTML = `
            <td><input type="text" placeholder="Equipamento" class="item-nome"></td>
            <td>
                <select class="item-tipo">
                    <option value="Cabo">Cabo (RJ45)</option>
                    <option value="Wi-Fi">Wi-Fi (Wireless)</option>
                    <option value="Fibra">Fibra Óptica</option>
                </select>
            </td>
            <td><input type="number" value="1" min="1" class="item-qtd" onchange="calcularTotal()"></td>
            <td class="no-print"><button class="btn-del" onclick="removerLinha(this)">✕</button></td>
        `;
        tabela.appendChild(novaLinha);
        calcularTotal();
    }

    function removerLinha(btn) {
        btn.parentElement.parentElement.remove();
        calcularTotal();
    }

    function calcularTotal() {
        let total = 0;
        document.querySelectorAll('.item-qtd').forEach(input => {
            total += parseInt(input.value) || 0;
        });
        document.getElementById('soma_total').innerText = total;
    }

    async function finalizarEnvio() {
        const status = document.getElementById('status');
        const arquivos = document.getElementById('midia').files;
        const protocolo = document.getElementById('protocolo_manual').value || "S/N";
        
        status.style.display = "block";
        status.style.background = "#fff3cd";
        status.innerText = "⏳ Processando envio...";

        let listaAtivos = "";
        document.querySelectorAll('#corpo_tabela tr').forEach(tr => {
            const nome = tr.querySelector('.item-nome').value;
            const tipo = tr.querySelector('.item-tipo').value;
            const qtd = tr.querySelector('.item-qtd').value;
            if(nome) listaAtivos += `• ${nome}: ${qtd} un (${tipo})\n`;
        });

        let texto = `<b>📡 RELATÓRIO CONNECTPRO | Protocolo: ${protocolo}</b>\n\n`;
        texto += `🏢 <b>Cliente:</b> ${document.getElementById('cliente').value}\n`;
        texto += `👤 <b>Técnico:</b> ${document.getElementById('tecnico').value}\n\n`;
        texto += `<b>🖥️ INVENTÁRIO DE ATIVOS:</b>\n${listaAtivos}`;
        texto += `\n🔢 <b>Total:</b> ${document.getElementById('soma_total').innerText} dispositivos\n\n`;
        texto += `<b>⚙️ INFRAESTRUTURA:</b>\n${document.getElementById('infra').value}\n\n`;
        texto += `<b>📝 OBSERVAÇÕES:</b>\n${document.getElementById('obs').value}\n`;

        try {
            // Enviar arquivos primeiro (um por um)
            for (let file of arquivos) {
                const formData = new FormData();
                formData.append("chat_id", CHAT_ID);
                formData.append(file.type.startsWith('video/') ? "video" : "photo", file);
                await fetch(`https://api.telegram.org/bot${TOKEN}/${file.type.startsWith('video/') ? 'sendVideo' : 'sendPhoto'}`, { method: "POST", body: formData });
            }

            // Enviar relatório de texto final
            await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: CHAT_ID, text: texto, parse_mode: "HTML" })
            });

            status.style.background = "#d4edda";
            status.innerText = "✅ ENVIADO COM SUCESSO!";
        } catch (e) {
            status.style.background = "#f8d7da";
            status.innerText = "❌ Falha no envio. Verifique a conexão.";
        }
    }
</script>

</body>
</html>

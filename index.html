<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vistoria Ora Empresas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --ora-dark: #0a2540; --ora-cyan: #0284c7; --bg-body: #0f172a; --card: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, var(--bg-body) 0%, #1e293b 100%); padding: 20px 10px; color: #1e293b; }
        .container { max-width: 700px; margin: 0 auto; background: var(--card); border-radius: 20px; padding: 30px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); }
        .card { border-left: 5px solid var(--ora-dark); background: #f8fafc; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .card-title { color: var(--ora-dark); font-weight: 800; text-transform: uppercase; margin-bottom: 15px; font-size: 14px; }
        label { font-size: 12px; font-weight: 700; color: #64748b; margin-bottom: 5px; display: block; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; }
        button { width: 100%; padding: 18px; background: var(--ora-cyan); color: white; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color:var(--ora-dark); text-align:center;">VISTORIA TÉCNICA</h2>

    <div class="card">
        <label>Tipo de Projeto</label>
        <select id="tipo_projeto" onchange="toggleMódulos()">
            <option value="Misto">Projeto Misto</option>
            <option value="CFTV">CFTV</option>
            <option value="Wi-Fi">Wi-Fi</option>
            <option value="Infra">Infra de Rede</option>
        </select>
    </div>

    <div class="card">
        <h3 class="card-title">Dados do Cliente</h3>
        <label>Cliente</label><input type="text" id="cliente">
        <label>Cidade/UF</label><input type="text" id="cidade" value="Teresina - PI">
        <label>Técnico</label><input type="text" id="tecnico">
    </div>

    <div class="card hidden" id="card_cftv">
        <h3 class="card-title">Parâmetros de CFTV</h3>
        <label>Qtd Câmeras</label><input type="number" id="cftv_qtd">
        <label>Tipo</label><select id="cftv_tipo"><option>Dome</option><option>Bullet</option><option>Speed Dome</option></select>
    </div>

    <div class="card hidden" id="card_wifi">
        <h3 class="card-title">Parâmetros de Rede</h3>
        <label>Qtd Usuários Wi-Fi</label><input type="number" id="wifi_users">
        <label>Qtd Dispositivos Cabeados</label><input type="number" id="rede_cabo">
        <label>Ambientes Atendidos</label><input type="text" id="wifi_amb">
    </div>

    <div class="card">
        <h3 class="card-title">Hardware e Infra</h3>
        <label>Equipamentos Existentes no Local</label>
        <textarea id="hw_existente" rows="3"></textarea>
        <label>Instalação do Zero (O que levar)</label>
        <textarea id="hw_previsto" rows="3"></textarea>
    </div>

    <button id="btn_finalizar" onclick="enviar()">Finalizar Vistoria</button>
</div>

<script>
    function toggleMódulos() {
        const tipo = document.getElementById('tipo_projeto').value;
        document.getElementById('card_cftv').style.display = (tipo === 'CFTV' || tipo === 'Misto') ? 'block' : 'none';
        document.getElementById('card_wifi').style.display = (tipo === 'Wi-Fi' || tipo === 'Misto' || tipo === 'Infra') ? 'block' : 'none';
    }
    
    async function enviar() {
        const t = `📡 LAUDO: ${document.getElementById('cliente').value}\n` +
                  `Tipo: ${document.getElementById('tipo_projeto').value}\n` +
                  `Existente: ${document.getElementById('hw_existente').value}\n` +
                  `Previsto: ${document.getElementById('hw_previsto').value}`;
        
        // Mantive a estrutura de envio para o seu Telegram
        const TOKEN = "8797747366:AAHBVt7Xh7O-hms4DmB6c8j5AmWiOhkB6K4";
        const CHAT_ID = "-5263060753";
        await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, { 
            method: "POST", headers: {"Content-Type":"application/json"}, 
            body: JSON.stringify({chat_id: CHAT_ID, text: t})
        });
        alert("Enviado!");
    }
</script>
</body>
</html>
